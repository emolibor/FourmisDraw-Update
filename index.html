<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><style>:root{color-scheme:light}body{margin:0;font-family:system-ui,sans-serif;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>FourmisDraw</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>@font-face{font-family:'Montserrat';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/montserrat-latin-ext-600-normal.woff2) format('woff2')}@font-face{font-family:'Montserrat';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/montserrat-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'Montserrat';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/montserrat-latin-ext-700-normal.woff2) format('woff2')}@font-face{font-family:'Montserrat';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/montserrat-latin-700-normal.woff2) format('woff2')}@font-face{font-family:'Montserrat';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/montserrat-latin-ext-800-normal.woff2) format('woff2')}@font-face{font-family:'Montserrat';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/montserrat-latin-800-normal.woff2) format('woff2')}@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-latin-ext-400-normal.woff2) format('woff2')}@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-sans-latin-ext-500-normal.woff2) format('woff2')}@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-sans-latin-500-normal.woff2) format('woff2')}@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-latin-ext-600-normal.woff2) format('woff2')}@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-mono-latin-ext-400-normal.woff2) format('woff2')}@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-ext-500-normal.woff2) format('woff2')}@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2')}</style>
<style>
/* Layout: full-bleed drawing surface; floating panels — context bar top, properties/layers right, command dock bottom-right */
:root{
  --bg:#EEF0F4; --surface:#FFFFFF; --surface-2:#F5F6F9; --line:#D6DAE3; --fg:#13213F; --muted:#5B6479;
  --accent:#E8343C; --accent-fg:#FFFFFF; --navy:#13213F; --sel:#1F6FEB; --canvas:#F7F8FA; --grid:#DCE0E8; --grid-strong:#BCC3D1;
  --shadow:0 6px 24px rgba(19,33,63,.12),0 1px 3px rgba(19,33,63,.10);
  --f-display:"Montserrat",system-ui,sans-serif; --f-ui:"IBM Plex Sans",system-ui,sans-serif; --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1222; --surface:#151E33; --surface-2:#1B2640; --line:#2A3654; --fg:#E9EDF5; --muted:#9AA4BC;
  --accent:#F0474F; --accent-fg:#FFFFFF; --navy:#E9EDF5; --sel:#5B9BFF; --canvas:#0E1628; --grid:#1C2740; --grid-strong:#2C3A5C; color-scheme:dark;
  --shadow:0 6px 24px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#0B1222; --surface:#151E33; --surface-2:#1B2640; --line:#2A3654; --fg:#E9EDF5; --muted:#9AA4BC;
  --accent:#F0474F; --accent-fg:#FFFFFF; --navy:#E9EDF5; --sel:#5B9BFF; --canvas:#0E1628; --grid:#1C2740; --grid-strong:#2C3A5C; color-scheme:dark;
  --shadow:0 6px 24px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.4);
}
/* app-level theme setting overrides the host */
html.app-light{
  --bg:#EEF0F4; --surface:#FFFFFF; --surface-2:#F5F6F9; --line:#D6DAE3; --fg:#13213F; --muted:#5B6479;
  --accent:#E8343C; --navy:#13213F; --sel:#1F6FEB; --canvas:#F7F8FA; --grid:#DCE0E8; --grid-strong:#BCC3D1; color-scheme:light;
  --shadow:0 6px 24px rgba(19,33,63,.12),0 1px 3px rgba(19,33,63,.10);
}
html.app-dark{
  --bg:#0B1222; --surface:#151E33; --surface-2:#1B2640; --line:#2A3654; --fg:#E9EDF5; --muted:#9AA4BC;
  --accent:#F0474F; --navy:#E9EDF5; --sel:#5B9BFF; --canvas:#0E1628; --grid:#1C2740; --grid-strong:#2C3A5C; color-scheme:dark;
  --shadow:0 6px 24px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.4);
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- HOME ---------- */
#home{height:100%;overflow:auto;padding-block:32px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.home-in{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:46px;height:auto}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:-.01em}
.brand h1 b{color:var(--accent);font-weight:700}
.home-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px}
.home-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--accent)}
.sec-title{margin:0;font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.grid-proj{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.cardw{position:relative;display:flex}.cardw>.card{flex:1;min-width:0}
.card .meta strong{padding-right:44px;overflow-wrap:anywhere}
.ren{position:absolute;right:6px;bottom:8px;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;background:transparent;color:var(--muted)}
.ren:hover{background:var(--surface-2);color:var(--fg)}
.card{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;transition:transform .15s;display:flex;flex-direction:column;border-radius:14px;border:1px solid var(--line);background:var(--surface);overflow:hidden;text-align:left;padding:0}
.card:hover{border-color:var(--muted)}
.card.pressing{transform:scale(.97)}
.card canvas{width:100%;aspect-ratio:4/3;display:block;background:var(--canvas)}
.card .meta{display:flex;flex-direction:column;gap:2px;padding:12px 14px}
.card .meta strong{font-weight:600;font-size:15px}
.card .meta span{color:var(--muted);font-size:12.5px}
.card.new{align-items:center;justify-content:center;min-height:220px;border-style:dashed;gap:10px;color:var(--muted);background:transparent}
.card.new svg.i{width:32px;height:32px}
.chip{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted);margin-left:6px;vertical-align:2px}
.empty-note{color:var(--muted);margin:0}

/* ---------- EDITOR ---------- */
#ui{position:fixed;left:0;top:0;width:100%;height:100%;transform-origin:50% 50%}
#ui{pointer-events:none}#home,.scrim,.toast,#v3d{pointer-events:auto}
#ui.anim{transition:transform .35s cubic-bezier(.2,.8,.2,1),width .35s,height .35s,left .35s,top .35s}
#editor{pointer-events:none}#editor .float{pointer-events:auto}
#editor{position:fixed;inset:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#editor input{-webkit-user-select:text;user-select:text}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;background:var(--canvas)}
.float{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.topstack{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:3}
.toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;width:100%;flex-wrap:wrap;pointer-events:none}
.toprow>.float,.topstack>.float{position:relative;pointer-events:auto}
.topbar{display:flex;align-items:center;gap:4px;padding:4px;flex:1 1 260px;min-width:0;max-width:440px}
.topbar .pname{border:0;background:transparent;font-weight:600;font-size:15px;flex:1 1 auto;min-width:60px;width:auto;padding:8px 6px;border-radius:8px;text-overflow:ellipsis}
.topbar .pname:hover,.topbar .pname:focus{background:var(--surface-2)}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;height:44px;padding:0 10px;border:0;border-radius:10px;background:transparent;font-size:13px;font-weight:500}
.ib:hover{background:var(--surface-2)}
.ib[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.ib:disabled{opacity:.35;cursor:default}
.ib .lbl{white-space:nowrap}
.sep{width:1px;height:26px;background:var(--line);margin:0 2px}
.topright{display:flex;gap:2px;padding:4px;flex:none;margin-left:auto}
.ctx{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:6px 10px;max-width:100%}
.ctx .xbtn{min-width:40px;height:40px;padding:0;border:1px solid var(--line);background:var(--surface-2);border-radius:10px}
.ctx:empty{display:none}
.ctx .t{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.ctx .hint{color:var(--muted);font-size:13px}
.fld{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.fld input[type=number],.fld input[type=text],.fld select{width:76px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:0 8px;color:var(--fg);font-family:var(--f-num)}
.fld select{width:auto;font-family:var(--f-ui)}
.fld .u{font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;height:38px;padding:0 12px;font-size:13px;font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.sbtn{height:38px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;font-weight:600}
.sbtn.go{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.readout{font-family:var(--f-num);font-size:12.5px;color:var(--muted)}

.dock{right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;padding:8px;width:min(440px,calc(100vw - 24px))}
.tabs{display:flex;gap:4px}
.tabs button{flex:1;height:38px;border:0;border-radius:8px;background:transparent;font-family:var(--f-display);font-weight:700;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface-2);color:var(--fg)}
.tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:60px;border:1px solid transparent;border-radius:10px;background:transparent;font-size:12px;font-weight:500;padding:6px 2px}
.tool:hover{background:var(--surface-2)}
.tool[aria-pressed="true"]{border-color:var(--accent);background:var(--surface-2);color:var(--accent)}
.tool svg.i{width:24px;height:24px}
.snaps{display:flex;gap:6px;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.snaps .lab{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:auto}
.tog{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:12.5px;font-weight:600}
.tog[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.side{right:max(12px,env(safe-area-inset-right,0px));top:calc(var(--topH,60px) + 18px + env(safe-area-inset-top,0px));width:min(300px,calc(100vw - 24px));max-height:calc(100% - var(--topH,60px) - 330px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:160px;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.side h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.side .row{display:grid;grid-template-columns:110px minmax(0,1fr);align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.side .row input,.side .row select{height:38px;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:0 8px;color:var(--fg);font-family:var(--f-num)}
.side .row select{font-family:var(--f-ui)}
.side .row input[type=range]{padding:0;accent-color:var(--accent);background:transparent;border:0}
.cmds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cmds button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:12px;min-height:56px}
.cmds button.del{color:var(--accent)}
.lay{display:grid;grid-template-columns:24px 38px 38px 26px minmax(0,1fr) 54px 34px;align-items:center;gap:2px;padding:2px 4px;border-radius:8px}
.lay.cur{background:var(--surface-2)}
.lay input[type=radio]{accent-color:var(--accent);width:18px;height:18px}
.lay .nm{border:0;background:transparent;height:34px;padding:0 6px;border-radius:6px;font-family:var(--f-num);font-size:13px;width:100%}
.lay .nm:focus{background:var(--surface)}
#layers{width:min(340px,calc(100vw - 24px))}
.lay .lw{height:34px;width:100%;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);font-family:var(--f-num);font-size:12px;padding:0 2px;color:var(--fg)}
.lay .sw{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);padding:0}
.lay .ib{min-width:40px;height:40px;padding:0}
.lay .ib.off{opacity:.4}
.lay-head{display:grid;grid-template-columns:24px 38px 38px 26px minmax(0,1fr) 54px 34px;gap:2px;padding:0 4px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.status{left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:6px 10px;font-size:12px;color:var(--muted);display:flex;gap:12px;border-radius:10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:50;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}

/* ---------- MODALS ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,12,24,.45);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:min(480px,100%);max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.modal h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:20px}
.modal p{margin:0;color:var(--muted);line-height:1.5}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:72px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);font-weight:600}
.opt small{font-weight:400;color:var(--muted);font-size:11.5px}
.xcol{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.xcol summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}
.xcol p{font-size:13px}
.xc-head{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.xc-row{display:grid;grid-template-columns:minmax(0,1fr) 22px 128px 78px;align-items:center;gap:8px;font-size:13px}
.xc-sw{width:22px;height:22px;border-radius:6px;border:1px solid var(--line)}
.xc-row select{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:0 6px;color:var(--fg)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mrow{display:flex;flex-direction:column;gap:8px}
.mrow > label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mfoot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:10px;min-height:40px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
#v3d{position:fixed;inset:0;z-index:45;background:var(--canvas)}
#v3d canvas{display:block;width:100%;height:100%;touch-action:none}
#v3d .float{z-index:2}
@media (max-width:720px){
  .ib .lbl{display:none}
  .dock{width:calc(100vw - 24px)}
  .side{max-height:calc(100% - var(--topH,60px) - 330px)}
  .status{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<canvas id="cv" hidden></canvas>
<div id="ui">
<div id="home">

/* ================= geometry: walls ================= */
function wallLen(e){return Math.hypot(e.x2-e.x1,e.y2-e.y1);}
function wallDir(e){const L=wallLen(e)||1;return [(e.x2-e.x1)/L,(e.y2-e.y1)/L];}
function endExt(e,pt){let ext=0;for(const o of ents()){if(o===e||o.type!=="wall"||!visible(o))continue;
  if(dist(pt,[o.x1,o.y1])<1.5||dist(pt,[o.x2,o.y2])<1.5){ext=Math.max(ext,o.thick/2);continue;}
  const r=projSeg(pt,[o.x1,o.y1],[o.x2,o.y2]);if(r.t>0.0005&&r.t<0.9995&&dist(pt,r.pt)<=o.thick/2+1)ext=Math.max(ext,o.thick/2);}return ext;}
function wallOpenings(e){const L=wallLen(e),u=wallDir(e),out=[];

  out.sort((a,b)=>a[0]-b[0]);return out;}
function wallSegs(e){ // solid pieces [s0,s1] along axis, with extension
  const L=wallLen(e),e0=endExt(e,[e.x1,e.y1]),e1=endExt(e,[e.x2,e.y2]);let segs=[[-e0,L+e1]];
  for(const o of wallOpenings(e)){const n=[];for(const s of segs){if(o[1]<=s[0]||o[0]>=s[1]){n.push(s);continue;}if(o[0]>s[0])n.push([s[0],o[0]]);if(o[1]<s[1])n.push([o[1],s[1]]);}segs=n;}
  return segs.filter(s=>s[1]-s[0]>0.5);}
function wallRect(e,s0,s1){const u=wallDir(e),n=[-u[1],u[0]],h=e.thick/2,p=s=>[e.x1+u[0]*s,e.y1+u[1]*s];const a=p(s0),b=p(s1);
  return [[a[0]+n[0]*h,a[1]+n[1]*h],[b[0]+n[0]*h,b[1]+n[1]*h],[b[0]-n[0]*h,b[1]-n[1]*h],[a[0]-n[0]*h,a[1]-n[1]*h]];}
function wallPolys(e){return wallSegs(e).map(s=>wallRect(e,s[0],s[1]));}

    P.push({k:"p",pts:swingArc([hx,face],w,[hx,face+s*w],[-hx,face])});}

  return P;}
function customStairPrims(e){const pts=e.pts,W=+e.width||100,gd=+e.depth||28,P=[];if(!pts||pts.length<2)return P;
  const off=(sgn)=>pts.map((p,i)=>{const a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)];let dx=b[0]-a[0],dy=b[1]-a[1];const L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;let nx=-dy,ny=dx;let k=1;

function getImg(src){if(!src)return null;let im=imgCache.get(src);if(!im){im=new Image();im.onload=()=>draw();im.src=src;imgCache.set(src,im);}return im.complete&&im.naturalWidth?im:null;}
function tracePrim(c,pr,T){c.beginPath();if(pr.k==="l"){const a=T(pr.a),b=T(pr.b);c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);}else if(pr.k==="p"){pr.pts.forEach((p,i)=>{const q=T(p);i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]);});if(pr.closed)c.closePath();}else if(pr.k==="c"){const q=T(pr.c);c.arc(q[0],q[1],pr.r*Tz,0,Math.PI*2);}}
let Tz=1;

  const z=view.z;Tz=z;const vr=view.r||0;const T=p=>{const q=vRot([(p[0]-view.x)*z,(p[1]-view.y)*z],vr);return [q[0]+w/2,q[1]+h/2];};const ls=o.lineScale||1;

  if(o.grid){const step=100,px=step*z;const cn=[[0,0],[w,0],[w,h],[0,h]].map(q=>{const v=vRot([(q[0]-w/2)/z,(q[1]-h/2)/z],-vr);return [v[0]+view.x,v[1]+view.y];});
    const x0=Math.min(...cn.map(p=>p[0])),x1=Math.max(...cn.map(p=>p[0])),y0=Math.min(...cn.map(p=>p[1])),y1=Math.max(...cn.map(p=>p[1]));const straight=Math.abs(Math.sin(vr*2))<1e-6;const rd=v=>straight?Math.round(v)+.5:v;
    const drawGrid=(st,col,lw)=>{c.strokeStyle=col;c.lineWidth=lw;c.beginPath();for(let x=Math.floor(x0/st)*st;x<=x1;x+=st){const a=T([x,y0]),b=T([x,y1]);c.moveTo(rd(a[0]),rd(a[1]));c.lineTo(rd(b[0]),rd(b[1]));}for(let y=Math.floor(y0/st)*st;y<=y1;y+=st){const a=T([x0,y]),b=T([x1,y]);c.moveTo(rd(a[0]),rd(a[1]));c.lineTo(rd(b[0]),rd(b[1]));}c.stroke();};
    if(px>=7)drawGrid(step,cssv("--grid"),1);if(px*5>=24)drawGrid(500,cssv("--grid-strong"),1);else drawGrid(1000,cssv("--grid-strong"),1);

function grips(e){if(e.type==="wall"||e.type==="line")return [[e.x1,e.y1],[e.x2,e.y2]];if(e.type==="pline"||e.type==="rect"||e.type==="mline")return e.pts;if(e.type==="circle")return [[e.cx,e.cy]];if(e.type==="column"||e.type==="text")return [[e.x,e.y]];if(e.type==="door"||e.type==="stair")return e.kind==="custom"?e.pts:[[e.x,e.y]];if(e.type==="image"||e.type==="antet")return [[e.x,e.y]];return [];}

function drawNow(){if(!S.proj)return;const dpr=window.devicePixelRatio||1;const w=W(),h=H();if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);}

function drawOverlay(){const c=g,z=S.view.z,T=w2s;Tz=z;const acc=cssv("--accent"),sel=cssv("--sel");const col=aci(layerOf(S.proj.cur).color);

    c.globalAlpha=1;c.strokeStyle=acc;c.lineWidth=1.8;prims(Object.assign({type:"stair"},S.stairProp.ent)).forEach(pr=>{tracePrim(c,pr,T);c.stroke();});
    const st=w2s(S.stairProp.path[0]);c.fillStyle=acc;c.beginPath();c.arc(st[0],st[1],6,0,Math.PI*2);c.fill();c.font="600 12px 'IBM Plex Sans', sans-serif";c.save();c.translate(st[0],st[1]);c.rotate(uiRad());c.fillText("Başlangıç",10,-10);c.restore();}
  // door ghost

    const u=[Math.cos(d.ang),Math.sin(d.ang)],n=[-u[1],u[0]],h=(d.thick||20)/2;c.fillStyle=cssv("--canvas");tracePrim(c,{k:"p",pts:[[d.x-u[0]*d.width/2+n[0]*h,d.y-u[1]*d.width/2+n[1]*h],[d.x+u[0]*d.width/2+n[0]*h,d.y+u[1]*d.width/2+n[1]*h],[d.x+u[0]*d.width/2-n[0]*h,d.y+u[1]*d.width/2-n[1]*h],[d.x-u[0]*d.width/2-n[0]*h,d.y-u[1]*d.width/2-n[1]*h]],closed:true},T);if(d.wallId)c.fill();c.stroke();
    prims(d).forEach(pr=>{tracePrim(c,pr,T);c.stroke();});c.globalAlpha=1;}
  if((S.tool==="antet_elek"||S.tool==="antet_mek")&&S.raw&&!S.cmd){const gh=antetGhost(S.raw,S.tool.slice(6));c.strokeStyle=acc;c.fillStyle=acc+"14";c.lineWidth=1.5;c.setLineDash([8,5]);tracePrim(c,{k:"p",pts:antRect(gh),closed:true},T);c.fill();c.stroke();c.setLineDash([]);c.globalAlpha=.45;c.lineWidth=1;antPrims(gh).forEach(pr=>{tracePrim(c,pr,T);c.stroke();});c.globalAlpha=1;}
  if(S.tool==="column"&&cur&&!S.cmd){const gh=colGhost(cur);c.strokeStyle=acc;c.fillStyle=acc+"33";c.lineWidth=1.5;prims(gh).forEach(pr=>{tracePrim(c,pr,T);c.fill();c.stroke();});}

  // alignment references and the active alignment line
  if(S.track&&S.track.length&&(S.tool!=="select"||S.drag||S.cmd)){c.strokeStyle=sel;c.lineWidth=1.5;for(const R of S.track){const q=T(R.p);c.beginPath();c.moveTo(q[0]-6,q[1]);c.lineTo(q[0]+6,q[1]);c.moveTo(q[0],q[1]-6);c.lineTo(q[0],q[1]+6);c.stroke();}}
  if(S.snap&&S.snap.k==="track"&&S.snap.refs){c.strokeStyle=sel;c.lineWidth=1.2;c.setLineDash([6,5]);const q=T(S.snap.p);for(const r of S.snap.refs){const a=T(r);const dx=q[0]-a[0],dy=q[1]-a[1],L=Math.hypot(dx,dy)||1;c.beginPath();c.moveTo(a[0]-dx/L*30,a[1]-dy/L*30);c.lineTo(q[0]+dx/L*60,q[1]+dy/L*60);c.stroke();}c.setLineDash([]);label(S.snap.p,"Hiza");}
  // snap marker
  if(S.snap&&cur&&(S.tool!=="select"||S.drag||S.cmd)){const q=T(S.snap.p);c.strokeStyle=S.snap.k==="grid"?cssv("--muted"):acc;c.lineWidth=2;const r=7;c.beginPath();
    if(S.snap.k==="end")c.rect(q[0]-r,q[1]-r,2*r,2*r);else if(S.snap.k==="mid"){c.moveTo(q[0],q[1]-r);c.lineTo(q[0]+r,q[1]+r*.8);c.lineTo(q[0]-r,q[1]+r*.8);c.closePath();}else if(S.snap.k==="cen")c.arc(q[0],q[1],r,0,Math.PI*2);else if(S.snap.k==="grid"){c.moveTo(q[0]-r,q[1]-r);c.lineTo(q[0]+r,q[1]+r);c.moveTo(q[0]+r,q[1]-r);c.lineTo(q[0]-r,q[1]+r);}else if(S.snap.k==="near"){c.moveTo(q[0]-r,q[1]-r);c.lineTo(q[0]+r,q[1]-r);c.lineTo(q[0]-r,q[1]+r);c.lineTo(q[0]+r,q[1]+r);c.closePath();}else if(S.snap.k==="int"){c.moveTo(q[0]-r,q[1]-r);c.lineTo(q[0]+r,q[1]+r);c.moveTo(q[0]+r,q[1]-r);c.lineTo(q[0]-r,q[1]+r);}

function uiRad(){return (typeof UIR!=="undefined"&&UIR&&UIR.deg)?rad(UIR.deg):0;}
function label(p,txt){const q=w2s(p);const c=g;c.save();c.translate(q[0],q[1]);c.rotate(uiRad());c.font="600 12px 'IBM Plex Mono', monospace";const w=c.measureText(txt).width+12;c.fillStyle=cssv("--fg");c.globalAlpha=.9;c.beginPath();c.roundRect?c.roundRect(14,14,w,22,6):c.rect(14,14,w,22);c.fill();c.globalAlpha=1;c.fillStyle=cssv("--bg");c.textAlign="left";c.textBaseline="middle";c.fillText(txt,20,25);c.restore();}
function lenLabel(a,b){const L=dist(a,b);const ang=deg(Math.atan2(-(b[1]-a[1]),b[0]-a[0]));label(b,fmt(L)+" cm  ∠"+fmt((ang+360)%360)+"°");}

function snapCands(wm,ex,only){const out=[];for(const e of (only||ents())){if(!visible(e)||(ex&&ex.has(e.id)))continue;
  if(e.type==="wall"){out.push({k:wm?"wend":"end",p:[e.x1,e.y1],r:wm?e.thick/2:0},{k:wm?"wend":"end",p:[e.x2,e.y2],r:wm?e.thick/2:0},{k:"mid",p:[(e.x1+e.x2)/2,(e.y1+e.y2)/2]});if(!wm)wallPolys(e).forEach(r=>r.forEach(p=>out.push({k:"end",p})));}
  else if(e.type==="line"){out.push({k:"end",p:[e.x1,e.y1]},{k:"end",p:[e.x2,e.y2]},{k:"mid",p:[(e.x1+e.x2)/2,(e.y1+e.y2)/2]});}
  else if(e.type==="pline"||e.type==="rect"||e.type==="mline"){e.pts.forEach(p=>out.push({k:"end",p}));if(e.type==="mline")mlinePrims(e).forEach(pr=>(pr.pts||[pr.a,pr.b]).forEach(q=>out.push({k:"end",p:q})));const n=e.pts.length;for(let i=0;i<n-(e.closed?0:1);i++)out.push({k:"mid",p:lerp(e.pts[i],e.pts[(i+1)%n],.5)});}
  else if(e.type==="circle"){out.push({k:"cen",p:[e.cx,e.cy]});[0,1,2,3].forEach(i=>out.push({k:"end",p:[e.cx+e.r*Math.cos(i*Math.PI/2),e.cy+e.r*Math.sin(i*Math.PI/2)]}));}
  else if(e.type==="column"){out.push({k:"cen",p:[e.x,e.y]});if(e.shape!=="round"){const q=colPts(e);q.forEach(p=>out.push({k:"end",p}));for(let i=0;i<4;i++)out.push({k:"mid",p:lerp(q[i],q[(i+1)%4],.5)});}else[0,1,2,3].forEach(i=>out.push({k:"end",p:[e.x+e.w/2*Math.cos(i*Math.PI/2),e.y+e.w/2*Math.sin(i*Math.PI/2)]}));}
  else if(e.type==="door"){out.push({k:"mid",p:[e.x,e.y]});}
  else if(e.type==="stair"){if(e.kind==="custom")e.pts.forEach(p=>out.push({k:"end",p}));else if(e.kind==="sketch")(e.outlines||[]).forEach(o=>o.pts.forEach(p=>out.push({k:"end",p})));else{out.push({k:"end",p:[e.x,e.y]});if(e.kind==="spiral")out.push({k:"cen",p:[e.x,e.y]});}}
  else if(e.type==="text"){out.push({k:"end",p:[e.x,e.y]});}
  else if(e.type==="image"){out.push({k:"end",p:[e.x,e.y]},{k:"end",p:[e.x+e.w,e.y+e.h]});}
  else if(e.type==="antet"){antRect(e).forEach(p=>out.push({k:"end",p}));}}
 return out;}
function nearestOn(p,tol,wm){let best=null;for(const e of ents()){if(!visible(e)||e.type==="image"||e.type==="text")continue;if(wm&&e.type==="wall"){const q=projSeg(p,[e.x1,e.y1],[e.x2,e.y2]).pt,dd=dist(p,q);if(dd<tol+e.thick/2&&(!best||dd<best.d))best={d:dd,p:q};continue;}let pr=e.type==="wall"?[{k:"l",a:[e.x1,e.y1],b:[e.x2,e.y2]}].concat(prims(e)):prims(e);

/* ---------- alignment tracking (AutoCAD-style): rest the pen on a snap point to pick it up as a reference ---------- */
function trackReset(){S.track=[];clearTimeout(S.acqT);S.acqKey=null;}
function trackDirs(p){const dirs=[[1,0],[0,1]];for(const e of ents()){if(!visible(e))continue;if(e.type==="wall"||e.type==="line"){if(dist(p,[e.x1,e.y1])<1||dist(p,[e.x2,e.y2])<1){const L=Math.hypot(e.x2-e.x1,e.y2-e.y1)||1,u=[(e.x2-e.x1)/L,(e.y2-e.y1)/L];if(Math.abs(u[0])>1e-3&&Math.abs(u[1])>1e-3)dirs.push(u,[-u[1],u[0]]);}}}return dirs;}

function moveSnap(mv,d){const tol=16/S.view.z;let best=null;

/* ================= hit testing ================= */

/* ================= undo ================= */
function pushUndo(){S.undo.push(JSON.stringify({ents:ents().map(e=>e.type==="image"?Object.assign({},e):e),layers:S.proj.layers}));if(S.undo.length>80)S.undo.shift();S.redo=[];updUndo();}
function restore(str){const o=JSON.parse(str);S.proj.ents=o.ents;S.proj.layers=o.layers;S.sel=new Set([...S.sel].filter(id=>byId(id)));markDirty();refreshPanels();draw();}

function redo(){if(!S.redo.length)return;S.undo.push(JSON.stringify({ents:ents(),layers:S.proj.layers}));restore(S.redo.pop());updUndo();}
function updUndo(){$("#btnUndo").disabled=!S.undo.length;$("#btnRedo").disabled=!S.redo.length;}
function addEnt(e){e.id=e.id||uid();e.layer=e.layer||S.proj.cur;if(e.op==null)e.op=1;ents().push(e);markDirty();return e;}

/* ================= transforms ================= */
// M = [a,b,c,d,e,f] : x' = a x + c y + e ; y' = b x + d y + f
function ap(M,p){return [M[0]*p[0]+M[2]*p[1]+M[4],M[1]*p[0]+M[3]*p[1]+M[5]];}
function mTrans(dx,dy){return [1,0,0,1,dx,dy];}
function mRot(c,a){const co=Math.cos(a),si=Math.sin(a);return [co,si,-si,co,c[0]-co*c[0]+si*c[1],c[1]-si*c[0]-co*c[1]];}
function mScale(c,s){return [s,0,0,s,c[0]-s*c[0],c[1]-s*c[1]];}
function mMirror(a,b){const ang=Math.atan2(b[1]-a[1],b[0]-a[0]);const c2=Math.cos(2*ang),s2=Math.sin(2*ang);return [c2,s2,s2,-c2,a[0]-c2*a[0]-s2*a[1],a[1]-s2*a[0]+c2*a[1]];}

  else if(e.type==="pline"||e.type==="rect"||e.type==="mline"){e.pts=e.pts.map(p=>ap(M,p));if(e.type==="mline"&&Math.abs(sc-1)>1e-6)e.width=Math.round(e.width*sc*10)/10;}

  else if(e.type==="text"){const c=ap(M,[e.x,e.y]);e.x=c[0];e.y=c[1];if(det>0){e.ang=Math.round(-deg(dirAng(rad(-(e.ang||0))))*10)/10;}if(Math.abs(sc-1)>1e-6)e.h=Math.round(e.h*sc*10)/10;}

}
function applyToSel(M,copy){pushUndo();const ids=[...S.sel];const newSel=new Set();const wallMap={};

  const wallIds=new Set(targets.filter(e=>e.type==="wall").map(e=>e.id));
  const riders=ents().filter(d=>d.type==="door"&&wallIds.has(d.wallId)&&!S.sel.has(d.id));
  const gm={};for(const e of targets.concat(riders)){let t=e;if(copy){t=JSON.parse(JSON.stringify(e));const old=t.id;t.id=uid();if(t.grp){gm[t.grp]=gm[t.grp]||uid();t.grp=gm[t.grp];}if(t.type==="wall")wallMap[old]=t.id;ents().push(t);}xformEnt(t,M);if(!riders.includes(e))newSel.add(t.id);else if(copy)newSel.add(t.id);}

function reattachDoor(d){const w=findWallAt([d.x,d.y],40);if(w){const pr=projOnWall(w,[d.x,d.y]);d.x=pr.p[0];d.y=pr.p[1];d.wallId=w.id;d.thick=w.thick;const u=wallDir(w);const a=Math.atan2(u[1],u[0]);if(Math.abs(Math.cos(a-d.ang))<.9)d.ang=a;}else d.wallId=null;}
function scaleFactor(cmd){return dist(cmd.base,S.raw||cmd.base)/cmd.ref;}
function cmdMatrix(cmd,cur){if(!cmd.base)return null;switch(cmd.name){
  case "move":case "copy":return mTrans(cur[0]-cmd.base[0],cur[1]-cmd.base[1]);
  case "rotate":return mRot(cmd.base,Math.atan2(cur[1]-cmd.base[1],cur[0]-cmd.base[0]));

/* ================= doors on walls ================= */
function projOnWall(w,p){const a=[w.x1,w.y1],b=[w.x2,w.y2];const r=projSeg(p,a,b);return {p:r.pt,t:r.t*wallLen(w),d:dist(p,r.pt)};}

function fld(id,label,val,unit,ph){return '<label class="fld" for="'+id+'">'+label+'<input type="number" inputmode="decimal" id="'+id+'" value="'+esc(val)+'"'+(ph?' placeholder="'+ph+'"':'')+'><span class="u">'+(unit||"")+'</span></label>';}
function stairSize(o){const e=Object.assign({type:"stair",x:0,y:0,ang:0,m:1},o);const b=bbox(e);return fmt(b[2]-b[0])+" × "+fmt(b[3]-b[1])+" cm";}

  C.innerHTML=h;bindCtx();}
function cancelTool(){trackReset();S.draft=null;S.cmd=null;S.stairProp=null;S.sketch.strokes=[];S.hoverDoor=null;S.offEnt=null;S.tool="select";renderDock();renderCtx();draw();}
function bindCtx(){const on=(id,ev,fn)=>{const el=document.getElementById(id);if(el)el.addEventListener(ev,fn);};
  const numOpt=(id,obj,key)=>on(id,"input",e=>{obj[key]=e.target.value===""?"":+e.target.value;if(S.tool==="stair"){updateStairReadout();if(S.stairProp&&(key==="width"||key==="depth"))rebuildProp(true);}draw();});
  numOpt("oThick",S.opt.wall,"thick");if(S.tool==="wall")numOpt("oH",S.opt.wall,"height");
  if(S.tool==="door"){on("oW","input",e=>{const v=e.target.value===""?"":+e.target.value;S.opt.door.width=v;if(v>0)rememberDoor(S.opt.door.kind,v);draw();});numOpt("oH",S.opt.door,"height");}
  numOpt("tH",S.opt.text,"h");numOpt("tA",S.opt.text,"ang");
  numOpt("cW",S.opt.column,"w");numOpt("cD",S.opt.column,"d");numOpt("cA",S.opt.column,"ang");if(S.tool==="column")numOpt("cH",S.opt.column,"height");
  on("cShape","click",e=>{const b=e.target.closest("button");if(!b)return;S.opt.column.shape=b.dataset.k;renderCtx();draw();});
  numOpt("sW",S.opt.stair,"width");numOpt("sN",S.opt.stair,"n");numOpt("sD",S.opt.stair,"depth");numOpt("sL",S.opt.stair,"landing");numOpt("sH",S.opt.stair,"height");
  on("oKind","click",e=>{const b=e.target.closest("button");if(!b)return;if(S.tool==="door"){S.opt.door.kind=b.dataset.k;S.opt.door.width=S.opt.door.widths[b.dataset.k]||90;}else{S.opt.stair.kind=b.dataset.k;S.draft=null;S.stairProp=null;S.sketch.strokes=[];}renderCtx();draw();});
  on("oEnd","click",()=>{finishDraft();renderCtx();draw();});
  on("spRev","click",()=>{const P=S.stairProp;if(P.sketch){reverseSketch(P.ent);renderCtx();draw();return;}P.path=P.path.slice().reverse();rebuildProp();});
  on("spRedo","click",()=>{S.stairProp=null;renderCtx();draw();});
  on("skUndo","click",()=>{S.sketch.strokes.pop();renderCtx();draw();});
  on("skClear","click",()=>{S.sketch.strokes=[];renderCtx();draw();});
  on("skConv","click",()=>{const r=interpretSketch(S.sketch.strokes);if(r.error){toast(r.error);return;}S.stairProp={sketch:true,ent:r.ent,label:r.label,path:[r.ent.arrow[0]]};renderCtx();draw();});
  on("spOk","click",()=>{const P=S.stairProp;if(!P)return;pushUndo();const st=addEnt(Object.assign({},P.ent,{type:"stair",layer:layerFor("MERDIVEN"),height:S.opt.stair.height}));if(P.sketch)S.sketch.strokes=[];S.stairProp=null;S.sel=new Set([st.id]);setTool("select");refreshPanels();toast(P.label.split(" ·")[0]+" eklendi");});
  numOpt("mW",S.opt.mline,"width");numOpt("ofD",S.opt.offset,"dist");on("mCaps","change",e=>{S.opt.mline.caps=e.target.checked;draw();});
  on("oClose","click",()=>{if(S.draft&&S.draft.kind==="pts"&&S.draft.pts.length>2){S.draft.closed=true;finishDraft();draw();}});
  on("oLen","keydown",e=>{if(e.key!=="Enter")return;const L=+e.target.value;if(!(L>0))return;typedLength(L);e.target.value="";});
  on("oR","keydown",e=>{if(e.key!=="Enter")return;const r=+e.target.value;if(S.draft&&S.draft.kind==="circle"&&S.draft.c&&r>0){pushUndo();addEnt({type:"circle",layer:drawLayer(),cx:S.draft.c[0],cy:S.draft.c[1],r});S.draft=null;draw();}});
  on("ctxX","click",cancelTool);
  on("cAng","keydown",e=>{if(e.key!=="Enter")return;const a=+e.target.value;if(isNaN(a))return;applyToSel(mRot(S.cmd.base,-rad(a)));endCmd();});
  on("cScl","keydown",e=>{if(e.key!=="Enter")return;const s=+String(e.target.value).replace(",",".");if(!(s>0))return;applyToSel(mScale(S.cmd.base,s));endCmd();});
  on("cLen","keydown",e=>{if(e.key!=="Enter")return;const L=+e.target.value;if(!(L>0)||!S.cur)return;const d=[S.cur[0]-S.cmd.base[0],S.cur[1]-S.cmd.base[1]];const n=Math.hypot(d[0],d[1])||1;S.sel=new Set(S.cmd.ids);placeCmd(mTrans(d[0]/n*L,d[1]/n*L));e.target.value="";});
}
function updateStairReadout(){const r=document.querySelector("#ctx .readout");if(r)r.textContent="Toplam: "+stairSize(S.opt.stair);}
function placeCmd(M){if(S.cmd.name==="copy"){const ids=S.cmd.ids.slice();S.sel=new Set(ids);applyToSel(M,true);S.sel=new Set(ids.filter(id=>byId(id)));refreshPanels();renderCtx();toast("Çoğaltıldı");return;}applyToSel(M,false);endCmd();}
function endCmd(){trackReset();S.cmd=null;renderDock();renderCtx();draw();}
function typedLength(L){const D=S.draft;let from=D&&D.kind==="chain"?D.start:D&&D.kind==="pts"?D.pts[D.pts.length-1]:null;if(!from){toast("Önce başlangıç noktasını seç");return;}
  let dir=S.cur?[S.cur[0]-from[0],S.cur[1]-from[1]]:[1,0];if(S.ortho)dir=Math.abs(dir[0])>=Math.abs(dir[1])?[Math.sign(dir[0])||1,0]:[0,Math.sign(dir[1])||1];const n=Math.hypot(dir[0],dir[1])||1;const p=[from[0]+dir[0]/n*L,from[1]+dir[1]/n*L];commitPoint(p);draw();}

/* ================= drawing actions ================= */
function commitPoint(p){const D=S.draft;
  if(S.tool==="wall"||S.tool==="line"){if(!D||!D.start){S.draft={kind:"chain",start:p,count:0};return;}
    if(dist(D.start,p)<0.5)return;pushUndo();
    if(S.tool==="wall"){const o=S.opt.wall;addEnt({type:"wall",layer:layerFor("DUVAR"),x1:D.start[0],y1:D.start[1],x2:p[0],y2:p[1],thick:+o.thick||20,height:o.height});}
    else addEnt({type:"line",layer:drawLayer(),x1:D.start[0],y1:D.start[1],x2:p[0],y2:p[1]});
    D.start=p;D.count++;return;}
  if(S.tool==="pline"||S.tool==="mline"||(S.tool==="stair"&&S.opt.stair.kind==="custom")){if(!D){S.draft={kind:"pts",pts:[p]};return;}const last=D.pts[D.pts.length-1];if(dist(last,p)<0.5)return;D.pts.push(p);return;}
}
function layerFor(def){const cur=S.proj.cur;return (cur==="0"||cur===def||!["DUVAR","KAPI","MERDIVEN"].includes(def))?(cur==="0"?def:cur):def;}
function finishDraft(){const D=S.draft;S.draft=null;if(!D||!S.proj)return;
  if(D.kind==="pts"){if(S.tool==="mline"&&D.pts.length>1){const o=S.opt.mline;pushUndo();addEnt({type:"mline",layer:drawLayer(),pts:D.pts,closed:!!D.closed&&D.pts.length>2,width:+o.width||20,caps:o.caps});}
    if(S.tool==="pline"&&D.pts.length>1){pushUndo();addEnt({type:"pline",layer:drawLayer(),pts:D.pts,closed:!!D.closed});}
    if(S.tool==="stair"&&D.pts.length>1){const o=S.opt.stair;pushUndo();addEnt({type:"stair",kind:"custom",layer:layerFor("MERDIVEN"),pts:D.pts,width:+o.width||100,depth:+o.depth||28,n:Math.round(pathLen(D.pts)/(+o.depth||28)),height:o.height,x:D.pts[0][0],y:D.pts[0][1],ang:0,m:1});}}
  refreshPanels();}
function drawLayer(){const c=S.proj.cur;return ["DUVAR","KAPI","MERDIVEN"].includes(c)?"CIZIM":c;}
function pathLen(p){let s=0;for(let i=0;i<p.length-1;i++)s+=dist(p[i],p[i+1]);return s;}

/* ================= pointer handling ================= */
let downInfo=null,lastTap=0;
function isDrawPointer(e){return e.pointerType==="pen"||(e.pointerType==="mouse"&&e.button===0)||(e.pointerType==="touch"&&SET.finger);}
cv.addEventListener("pointerdown",e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);S.pointers.set(e.pointerId,{x:e.offsetX,y:e.offsetY,type:e.pointerType});
  const touches=[...S.pointers.values()].filter(p=>p.type==="touch");
  if(touches.length>=2){downInfo=null;S.box=null;S.drag=null;startPinch();return;}
  if(e.pointerType==="mouse"&&(e.button===1||e.button===2)){S.pan={x:e.offsetX,y:e.offsetY,vx:S.view.x,vy:S.view.y};return;}
  if(!isDrawPointer(e)){S.pan={x:e.offsetX,y:e.offsetY,vx:S.view.x,vy:S.view.y};if(e.pointerType==="touch")S.tap={id:e.pointerId,x:e.offsetX,y:e.offsetY,t:Date.now()};return;}
  const raw=s2w(e.offsetX,e.offsetY);updateCursor(raw);downInfo={x:e.offsetX,y:e.offsetY,p:S.cur,raw,id:e.pointerId,moved:false};
  toolDown(raw,e);draw();});
cv.addEventListener("pointermove",e=>{const pp=S.pointers.get(e.pointerId);if(pp){pp.x=e.offsetX;pp.y=e.offsetY;}
  if(S.pinch){doPinch();return;}
  if(S.tap&&S.tap.id===e.pointerId&&Math.hypot(e.offsetX-S.tap.x,e.offsetY-S.tap.y)>8)S.tap=null;
  if(S.pan&&pp){const dv=vRot([(e.offsetX-S.pan.x)/S.view.z,(e.offsetY-S.pan.y)/S.view.z],-(S.view.r||0));S.view.x=S.pan.vx-dv[0];S.view.y=S.pan.vy-dv[1];draw();return;}
  if(e.pointerType==="touch"&&!SET.finger)return;
  const raw=s2w(e.offsetX,e.offsetY);updateCursor(raw);
  if(downInfo&&Math.hypot(e.offsetX-downInfo.x,e.offsetY-downInfo.y)>6)downInfo.moved=true;
  toolMove(raw,e);draw();});
function endPointer(e){const had=S.pointers.has(e.pointerId);S.pointers.delete(e.pointerId);
  if(S.pinch){if([...S.pointers.values()].filter(p=>p.type==="touch").length<2)S.pinch=null;S.pan=null;return;}
  if(S.pan){S.pan=null;if(S.tap&&S.tap.id===e.pointerId&&Date.now()-S.tap.t<450)fingerTap(s2w(S.tap.x,S.tap.y));S.tap=null;return;}
  if(!had||!downInfo||downInfo.id!==e.pointerId)return;if(e.type==="pointercancel"){downInfo=null;S.box=null;S.drag=null;draw();return;}
  const raw=s2w(e.offsetX,e.offsetY);updateCursor(raw);toolUp(raw,e);downInfo=null;draw();}
cv.addEventListener("pointerup",endPointer);cv.addEventListener("pointercancel",endPointer);
cv.addEventListener("pointerleave",e=>{if(e.pointerType!=="touch"&&!downInfo){S.cur=null;S.snap=null;draw();}});
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("wheel",e=>{e.preventDefault();const f=Math.exp(-e.deltaY*0.0015);zoomAt(e.offsetX,e.offsetY,f);},{passive:false});
function zoomAt(sx,sy,f){const before=s2w(sx,sy);S.view.z=clamp(S.view.z*f,0.02,8);const after=s2w(sx,sy);S.view.x+=before[0]-after[0];S.view.y+=before[1]-after[1];updStatus();draw();}
function fingerTap(raw){if(S.cmd||S.draft)return;const hit=hitTest(raw,22);
  if(hit){if(S.tool!=="select"){S.tool="select";S.hoverDoor=null;renderDock();renderCtx();}S.sel=grpSet(hit.id);refreshPanels();draw();}
  else if(S.tool==="select"&&S.sel.size){S.sel.clear();refreshPanels();draw();}}
function startPinch(){S.tap=null;const t=[...S.pointers.values()].filter(p=>p.type==="touch");const a=t[0],b=t[1];S.pinch={d:Math.hypot(a.x-b.x,a.y-b.y),c:[(a.x+b.x)/2,(a.y+b.y)/2],w:s2w((a.x+b.x)/2,(a.y+b.y)/2),z:S.view.z};S.pan=null;}
function doPinch(){const t=[...S.pointers.values()].filter(p=>p.type==="touch");if(t.length<2)return;const a=t[0],b=t[1];const d=Math.hypot(a.x-b.x,a.y-b.y),c=[(a.x+b.x)/2,(a.y+b.y)/2];S.view.z=clamp(S.pinch.z*d/S.pinch.d,0.02,8);const dv=vRot([(c[0]-W()/2)/S.view.z,(c[1]-H()/2)/S.view.z],-(S.view.r||0));S.view.x=S.pinch.w[0]-dv[0];S.view.y=S.pinch.w[1]-dv[1];updStatus();draw();}
function fromPoint(){const D=S.draft;if(S.cmd&&S.cmd.base)return S.cmd.base;if(D&&D.kind==="chain")return D.start;if(D&&D.kind==="pts")return D.pts[D.pts.length-1];if(D&&D.kind==="rect")return D.a;if(D&&D.kind==="circle")return D.c;return null;}
function updateCursor(raw){S.raw=raw;if(S.cmd&&S.cmd.base&&(S.cmd.name==="move"||S.cmd.name==="copy")){if(!S.cmd.mv)S.cmd.mv=buildMoveSnap();const r=moveSnap(S.cmd.mv,[raw[0]-S.cmd.base[0],raw[1]-S.cmd.base[1]]);S.cur=[S.cmd.base[0]+r.d[0],S.cmd.base[1]+r.d[1]];S.snap=r.snap;}
  else if(S.tool==="select"&&!S.cmd){S.snap=null;S.cur=raw;}else{const s=snapPoint(raw,fromPoint());S.snap=s.k?s:null;S.cur=s.p;if(S.snap&&["end","mid","cen","int"].includes(S.snap.k)&&!(S.cmd&&S.cmd.base))scheduleAcq(S.snap.p,null);else if(!S.snap||S.snap.k!=="track")cancelAcq();}
  $("#stXY").textContent="x "+fmt(S.cur[0])+" · y "+fmt(-S.cur[1]);$("#stSnap").textContent=S.snap?({track:"Hiza",end:"Uç nokta",mid:"Orta nokta",cen:"Merkez",grid:"Izgara",near:"Üzerinde",int:"Kesişim"}[S.snap.k]):"";}
function updStatus(){const px=100*S.view.z;$("#stZ").textContent="1 kare = 1 m · "+Math.round(px)+" px";}

function toolDown(raw,e){const p=S.cur;
  if(S.cmd){if((S.cmd.name==="move"||S.cmd.name==="copy")&&!S.cmd.base){const hit=hitTest(raw,e.pointerType==="touch"?22:10);
      if(hit){if(!S.sel.has(hit.id))S.sel=grpSet(hit.id);S.cmd.ids=[...S.sel];S.cmd.base=p;S.cmd.fromDown=true;refreshPanels();renderCtx();}}
    if(S.cmd.name==="scale"&&S.cmd.base)S.cmd.ref=Math.max(dist(S.cmd.base,raw),40/S.view.z);
    return;}
  if(S.tool==="select"){const hit=hitTest(raw);if(hit){if(e.shiftKey){{const gs=grpSet(hit.id);if(S.sel.has(hit.id))gs.forEach(id=>S.sel.delete(id));else gs.forEach(id=>S.sel.add(id));};}else if(!S.sel.has(hit.id)){S.sel=grpSet(hit.id);}
      S.drag={start:raw,snap:JSON.stringify(ents()),moved:false,mv:buildMoveSnap(),hit:hit.id,shift:e.shiftKey};refreshPanels();}
    else{if(!e.shiftKey)S.sel.clear();S.box={a:raw,b:raw};refreshPanels();}return;}
  if(S.tool==="wall"||S.tool==="line"){if(!S.draft)S.draft={kind:"chain",start:p,count:0};return;}
  if(S.tool==="stair"&&(S.opt.stair.kind==="custom"||S.opt.stair.kind==="sketch")){if(S.stairProp)return;S.draft={kind:"scribble",pts:[raw]};return;}
  if(S.tool==="pline"||S.tool==="mline"){if(!S.draft)S.draft={kind:"pts",pts:[p]};return;}
  if(S.tool==="circle"){if(!S.draft)S.draft={kind:"circle",c:p};return;}
  if(S.tool==="rect"){if(!S.draft)S.draft={kind:"rect",a:p};return;}
  if(S.tool==="door"){S.hoverDoor=doorGhost(raw);return;}}
function toolMove(raw,e){
  if(S.tool==="select"&&!S.cmd){if(S.drag&&downInfo&&downInfo.moved){const orig=JSON.parse(S.drag.snap);const r=moveSnap(S.drag.mv,[raw[0]-S.drag.start[0],raw[1]-S.drag.start[1]]);const d=r.d;S.snap=r.snap;
      S.proj.ents=orig;const M=mTrans(d[0],d[1]);const wallIds=new Set();for(const id of S.sel){const x=byId(id);if(x&&editable(x)){xformEnt(x,M);if(x.type==="wall")wallIds.add(x.id);}}
      ents().forEach(dr=>{if(dr.type==="door"&&wallIds.has(dr.wallId)&&!S.sel.has(dr.id))xformEnt(dr,M);});S.drag.moved=true;}
    else if(S.box){S.box.b=raw;}return;}
  if(S.tool==="door")S.hoverDoor=doorGhost(raw);
  if(S.draft&&S.draft.kind==="scribble"&&downInfo){const last=S.draft.pts[S.draft.pts.length-1];if(dist(last,raw)*S.view.z>3)S.draft.pts.push(raw);}}
function toolUp(raw,e){const p=S.cur;const moved=downInfo&&downInfo.moved;
  if(S.cmd){if(!S.cmd.base){if(!S.sel.size){toast("Bir elemana bas");return;}S.cmd.base=p;S.cmd.ids=[...S.sel];renderCtx();return;}
    if(S.cmd.fromDown){S.cmd.fromDown=false;if(!moved)return;}
    if(S.cmd.name==="scale"&&!moved){S.cmd.ref=null;return;}
    const M=cmdMatrix(S.cmd,p);if(!M)return;placeCmd(M);return;}
  if(S.tool==="select"){if(S.drag&&!S.drag.moved&&!S.drag.shift){const a=byId(S.drag.hit);const fd=a&&a.type==="antet"&&antFieldAt(a,raw);if(fd){S.drag=null;trackReset();antetFieldModal(a,fd);return;}}
    if(S.drag){trackReset();if(S.drag.moved){const now=JSON.stringify(ents());S.proj.ents=JSON.parse(S.drag.snap);pushUndo();S.proj.ents=JSON.parse(now);for(const id of S.sel){const d=byId(id);if(d&&d.type==="door")reattachDoor(d);}markDirty();refreshPanels();}S.drag=null;return;}
    if(S.box){const a=S.box.a,b=S.box.b;S.box=null;if(dist(a,b)*S.view.z<6)return;const x0=Math.min(a[0],b[0]),x1=Math.max(a[0],b[0]),y0=Math.min(a[1],b[1]),y1=Math.max(a[1],b[1]);
      for(const en of ents()){if(!editable(en))continue;const bb=bbox(en);if(bb[0]>=x0&&bb[2]<=x1&&bb[1]>=y0&&bb[3]<=y1)grpSet(en.id).forEach(id=>S.sel.add(id));}refreshPanels();}return;}
  if(S.tool==="offset"){if(!S.offEnt){const hit=hitTest(raw,e.pointerType==="touch"?22:10);if(hit&&offsetGhost(hit,raw)){S.offEnt=hit.id;S.sel=new Set([hit.id]);}else if(hit)toast("Bu eleman ötelenemiyor");renderCtx();return;}
    const src=byId(S.offEnt),gh=src&&offsetGhost(src,raw);if(gh){pushUndo();gh.id=uid();addEnt(gh);}S.offEnt=null;S.sel.clear();renderCtx();refreshPanels();return;}
  if(S.tool==="stair"&&S.opt.stair.kind==="sketch"){const D=S.draft;S.draft=null;if(!D||D.kind!=="scribble")return;D.pts.push(raw);if(pathLen(D.pts)*S.view.z>=6)S.sketch.strokes.push(D.pts);renderCtx();return;}
  if(S.tool==="stair"&&S.opt.stair.kind==="custom"){const D=S.draft;S.draft=null;if(!D||D.kind!=="scribble")return;D.pts.push(raw);
    if(pathLen(D.pts)*S.view.z<40){toast("Biraz daha uzun karala");return;}S.stairProp={raw:D.pts};interpretScribble();renderCtx();return;}
  if(S.tool==="wall"||S.tool==="line"||S.tool==="pline"||S.tool==="mline"){const D=S.draft;
    const last=D?(D.kind==="chain"?D.start:D.pts[D.pts.length-1]):null;const now=Date.now();
    if(D&&last&&dist(last,p)*S.view.z<8){ // tap on last point: finish if double-tap
      const hasSeg=D.kind==="chain"?D.count>0:D.pts.length>1;if(hasSeg&&now-lastTap<500){finishDraft();renderCtx();}lastTap=now;return;}
    lastTap=now;commitPoint(p);renderCtx();return;}
  if(S.tool==="circle"){const D=S.draft;if(!D)return;const r=dist(D.c,p);if(r*S.view.z<4)return;pushUndo();addEnt({type:"circle",layer:drawLayer(),cx:D.c[0],cy:D.c[1],r});S.draft=null;return;}
  if(S.tool==="rect"){const D=S.draft;if(!D)return;const a=D.a;if(Math.abs(p[0]-a[0])<0.5||Math.abs(p[1]-a[1])<0.5)return;pushUndo();addEnt({type:"rect",layer:drawLayer(),pts:[a,[p[0],a[1]],p,[a[0],p[1]]],closed:true});S.draft=null;return;}
  if(S.tool==="trim"){trimAt(raw);return;}
  if(S.tool==="text"){textModal(null,p);return;}
  if(S.tool==="antet_elek"||S.tool==="antet_mek"){placeAntet(raw,S.tool.slice(6));return;}
  if(S.tool==="column"){const o=S.opt.column;pushUndo();addEnt(Object.assign(colGhost(p),{layer:colLayer()}));renderCtx();return;}
  if(S.tool==="door"){const d=doorGhost(raw);if(!d.wallId){toast("Kapıyı bir duvarın üzerine bırak");return;}pushUndo();d.layer=layerFor("KAPI");addEnt(d);S.sel=new Set([d.id]);refreshPanels();return;}
  if(S.tool==="stair"){const o=S.opt.stair;pushUndo();const st=addEnt({type:"stair",kind:o.kind,layer:layerFor("MERDIVEN"),x:p[0],y:p[1],ang:0,m:1,width:+o.width||100,n:+o.n||16,depth:+o.depth||28,landing:+o.landing||100,height:o.height});S.sel=new Set([st.id]);setTool("select");refreshPanels();return;}}

document.addEventListener("keydown",e=>{if(!S.proj||$("#editor").hidden)return;const tag=(e.target.tagName||"").toLowerCase();if(tag==="input"||tag==="select")return;
  if(e.key==="Escape"){if(S.draft){finishDraft();}else if(S.cmd){S.cmd=null;}else{S.sel.clear();refreshPanels();}renderDock();renderCtx();draw();}
  else if(e.key==="Enter"){finishDraft();renderCtx();draw();}
  else if(e.key==="Delete"||e.key==="Backspace"){eraseSel();}
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){e.shiftKey?redo():undo();e.preventDefault();}
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="g"){toggleGroup();e.preventDefault();}
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="y"){redo();e.preventDefault();}});
window.addEventListener("resize",()=>draw());

/* ================= properties panel ================= */
const TYPE_NAME={wall:"Duvar",door:"Kapı",column:"Kolon",text:"Metin",stair:"Merdiven",line:"Çizgi",pline:"Polyline",mline:"Çoklu çizgi",rect:"Dikdörtgen",circle:"Daire",image:"Altlık",antet:"Antet"};
function prow(label,inner){return '<div class="row"><span>'+label+'</span>'+inner+'</div>';}
function pnum(key,val,step){return '<input type="number" inputmode="decimal" data-k="'+key+'" value="'+(val===""||val==null?"":Math.round(val*10)/10)+'"'+(step?' step="'+step+'"':'')+'>';}
function refreshPanels(){renderProps();if(!$("#layers").hidden)renderLayers();}
function renderProps(){const P=$("#props");if(!S.sel.size||!$("#layers").hidden&&false){P.hidden=true;return;}
  const sel=[...S.sel].map(byId).filter(Boolean);if(!sel.length){P.hidden=true;return;}$("#layers").hidden=true;$("#btnLayers").setAttribute("aria-pressed","false");P.hidden=false;
  const e=sel[0],one=sel.length===1;const gi=grpInfo();let h='<h2>'+(one?(e.type==="door"&&e.kind==="opening"?"Boşluk":TYPE_NAME[e.type]):(gi.whole?"Grup · ":"")+sel.length+" eleman")+'<button class="ib" type="button" id="pClose" aria-label="Kapat">'+ico("close")+'</button></h2>';
  h+=prow("Katman",'<select data-k="layer">'+S.proj.layers.map(l=>'<option'+(l.name===e.layer?" selected":"")+'>'+esc(l.name)+'</option>').join("")+'</select>');
  h+=prow("Opaklık",'<input type="range" min="0.1" max="1" step="0.05" data-k="op" value="'+(e.op??1)+'">');
  if(one){if(e.type==="wall"){h+=prow("Kalınlık",pnum("thick",e.thick))+prow("Uzunluk",pnum("len",wallLen(e)))+prow("Yükseklik",pnum("height",e.height));}
    if(e.type==="line"){h+=prow("Uzunluk",pnum("len",dist([e.x1,e.y1],[e.x2,e.y2])))+prow("Açı",pnum("lang",(deg(Math.atan2(-(e.y2-e.y1),e.x2-e.x1))+360)%360));}
    if(e.type==="circle"){h+=prow("Yarıçap",pnum("r",e.r))+prow("Çap",pnum("dia",e.r*2));}
    if(e.type==="rect"){const b=bbox(e);h+=prow("Genişlik",pnum("rw",b[2]-b[0]))+prow("Yükseklik",pnum("rh",b[3]-b[1]));}
    if(e.type==="mline"){h+=prow("Aralık",pnum("width",e.width))+prow("Kapalı",'<select data-k="closed"><option value="0"'+(e.closed?"":" selected")+'>Hayır</option><option value="1"'+(e.closed?" selected":"")+'>Evet</option></select>')+prow("Uçları kapat",'<select data-k="caps"><option value="1"'+(e.caps!==false?" selected":"")+'>Evet</option><option value="0"'+(e.caps===false?" selected":"")+'>Hayır</option></select>');}
    if(e.type==="pline"){h+=prow("Kapalı",'<select data-k="closed"><option value="0"'+(e.closed?"":" selected")+'>Hayır</option><option value="1"'+(e.closed?" selected":"")+'>Evet</option></select>')+prow("Uzunluk",'<span class="num">'+fmt(pathLen(e.closed?e.pts.concat([e.pts[0]]):e.pts))+' cm</span>');}
    if(e.type==="door"){h+=prow("Tür",'<select data-k="kind">'+DOOR_KINDS.map(([k,l])=>'<option value="'+k+'"'+(e.kind===k?" selected":"")+'>'+l+'</option>').join("")+'</select>')+prow("Genişlik",pnum("width",e.width))+prow("Yükseklik",pnum("height",e.height))+(e.kind==="opening"?'':'<div class="cmds" style="grid-template-columns:1fr 1fr"><button type="button" data-act="flip">Açılış yönü</button><button type="button" data-act="hand">Menteşe tarafı</button></div>');}
    if(e.type==="stair"){const b=bbox(e);if(e.kind==="sketch"){h+=prow("Tür",'<span>Detaylı karalama</span>')+prow("Basamak",'<span class="num">'+e.n+'</span>')+prow("Toplam yükseklik",pnum("height",e.height))+prow("Ölçü",'<span class="num">'+fmt(b[2]-b[0])+" × "+fmt(b[3]-b[1])+' cm</span>')+'<div class="cmds" style="grid-template-columns:1fr"><button type="button" data-act="srev">Çıkış yönünü ters çevir</button></div>';}
      else{h+=prow("Tür",'<span>'+(STAIR_KINDS.find(k=>k[0]===e.kind)||["","Serbest"])[1]+'</span>')+prow("Kol genişliği",pnum("width",e.width))+(e.kind!=="custom"?prow("Basamak",pnum("n",e.n)):"")+prow("Basamak derinliği",pnum("depth",e.depth))+(e.kind==="U"?prow("Sahanlık",pnum("landing",e.landing)):"")+prow("Toplam yükseklik",pnum("height",e.height))+(e.kind!=="custom"?prow("Açı",pnum("sang",(deg(-(e.ang||0))+360)%360)):"");h+=prow("Ölçü",'<span class="num">'+fmt(b[2]-b[0])+" × "+fmt(b[3]-b[1])+' cm</span>');}}
    if(e.type==="text"){h+=prow("Yazı",'<input type="text" data-k="txt" value="'+esc(e.txt||"")+'" style="font-family:var(--f-ui)">')+prow("Yazı boyu",pnum("th",e.h))+prow("Açı",pnum("ta",e.ang||0));}
    if(e.type==="column"){h+=prow("Biçim",'<select data-k="shape"><option value="rect"'+(e.shape!=="round"?" selected":"")+'>Dikdörtgen</option><option value="round"'+(e.shape==="round"?" selected":"")+'>Yuvarlak</option></select>')+(e.shape==="round"?prow("Çap",pnum("cw",e.w)):prow("Genişlik",pnum("cw",e.w))+prow("Derinlik",pnum("cd",e.d))+prow("Açı",pnum("ca",e.ang||0)))+prow("Yükseklik",pnum("height",e.height));}
    if(e.type==="image"){h+=prow("Genişlik",pnum("iw",e.w));}
    if(e.type==="antet"){const t=antT(e);const nf=t.fields.filter(f=>antVal(e,f)).length;h+=prow("Tür",'<span>'+ANTET_NAME[e.v]+'</span>')+prow("Boyut",'<span class="num">A4 · 1/100 · sabit</span>')+prow("Dolu alan",'<span class="num">'+nf+' / '+t.fields.length+'</span>')+'<div class="cmds" style="grid-template-columns:1fr"><button type="button" data-act="afill">Alanları sırayla doldur</button></div>';}}
  if(sel.length>1||gi.any)h+='<div class="cmds" style="grid-template-columns:1fr"><button type="button" id="pGrp">'+ico("group")+(gi.whole?"Grubu çöz":"Grupla")+'</button></div>';
  h+='<div class="cmds">'+[["move","Taşı"],["rotate","Döndür"],["scale","Ölçekle"],["mirror","Aynala"],["copy","Çoğalt"],["erase","Sil"]].map(([k,l])=>'<button type="button" data-cmd="'+k+'"'+(k==="erase"?' class="del"':"")+'>'+ico(k)+l+'</button>').join("")+'</div>';
  P.innerHTML=h;
  const pg=P.querySelector("#pGrp");if(pg)pg.onclick=toggleGroup;
  P.querySelector("#pClose").onclick=()=>{S.sel.clear();P.hidden=true;draw();};
  P.querySelectorAll("[data-cmd]").forEach(b=>b.onclick=()=>startCmd(b.dataset.cmd));
  P.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{pushUndo();if(b.dataset.act==="afill"){S.undo.pop();updUndo();const t=antT(e);antetFieldModal(e,t.fields.find(f=>!antVal(e,f))||t.fields[0]);return;}if(b.dataset.act==="flip")e.flip=-(e.flip||1);else if(b.dataset.act==="srev")reverseSketch(e);else e.hand=-(e.hand||1);markDirty();draw();});
  P.querySelectorAll("[data-k]").forEach(inp=>{const ev=inp.type==="range"?"input":"change";let pushed=false;inp.addEventListener(ev,()=>{if(!pushed){pushUndo();pushed=inp.type==="range";}const k=inp.dataset.k,v=inp.value;
    for(const x of sel){if(k==="layer")x.layer=v;else if(k==="op")x.op=+v;}
    if(one){const n=v===""?"":+v;
      if(k==="thick")e.thick=Math.max(1,n);if(k==="height")e.height=n;
      if(k==="len"&&n>0){if(e.type==="wall"){const u=wallDir(e);e.x2=e.x1+u[0]*n;e.y2=e.y1+u[1]*n;}else{const L=dist([e.x1,e.y1],[e.x2,e.y2])||1;e.x2=e.x1+(e.x2-e.x1)/L*n;e.y2=e.y1+(e.y2-e.y1)/L*n;}}
      if(k==="lang"){const L=dist([e.x1,e.y1],[e.x2,e.y2]);e.x2=e.x1+L*Math.cos(rad(n));e.y2=e.y1-L*Math.sin(rad(n));}
      if(k==="r"&&n>0)e.r=n;if(k==="dia"&&n>0)e.r=n/2;
      if((k==="rw"||k==="rh")&&n>0){const b=bbox(e);const sx=k==="rw"?n/(b[2]-b[0]):1,sy=k==="rh"?n/(b[3]-b[1]):1;e.pts=e.pts.map(p=>[b[0]+(p[0]-b[0])*sx,b[1]+(p[1]-b[1])*sy]);}
      if(k==="closed")e.closed=v==="1";if(k==="caps")e.caps=v==="1";
      if(k==="kind")e.kind=v;if(k==="width"&&n>0){e.width=n;if(e.type==="door")rememberDoor(e.kind,n);}if(k==="n"&&n>1)e.n=Math.round(n);if(k==="depth"&&n>0)e.depth=n;if(k==="landing"&&n>0)e.landing=n;
      if(e.type==="text"){if(k==="txt"&&v.trim())e.txt=v.trim();if(k==="th"&&n>0)e.h=n;if(k==="ta")e.ang=n||0;}
      if(e.type==="column"){if(k==="cw"&&n>0)e.w=n;if(k==="cd"&&n>0)e.d=n;if(k==="ca")e.ang=n||0;if(k==="shape")e.shape=v;}
      if(k==="sang")e.ang=-rad(n);
      if(k==="iw"&&n>0){const r=e.h/e.w;e.w=n;e.h=n*r;}}
    markDirty();draw();if(k!=="op")renderProps();});});}

function renderLayers(){const P=$("#layers");const L=S.proj.layers;
  let h='<h2>Katmanlar<button class="ib" type="button" id="lClose" aria-label="Kapat">'+ico("close")+'</button></h2><div class="lay-head"><span></span><span></span><span></span><span></span><span>Ad</span><span>Kalınlık mm</span><span></span></div>';

  h+='<button class="btn" type="button" id="lAdd">'+ico("plus")+'Yeni katman</button>';
  P.innerHTML=h;
  P.querySelector("#lClose").onclick=()=>{P.hidden=true;$("#btnLayers").setAttribute("aria-pressed","false");};

function extents(list){let b=[1e18,1e18,-1e18,-1e18];for(const e of list){if(!visible(e))continue;const x=bbox(e);b=[Math.min(b[0],x[0]),Math.min(b[1],x[1]),Math.max(b[2],x[2]),Math.max(b[3],x[3])];}if(b[0]>b[2])b=[0,0,1000,700];return b;}

function rasterize(scale,white){const b=extents(ents());const pad=80;const wcm=b[2]-b[0]+pad*2,hcm=b[3]-b[1]+pad*2;let z=scale;const maxPx=6000;z=Math.min(z,maxPx/wcm,maxPx/hcm);
  const cw=Math.ceil(wcm*z),ch=Math.ceil(hcm*z);const c=document.createElement("canvas");c.width=cw;c.height=ch;const x=c.getContext("2d");
  const keep=isDark;if(white)isDark=false;renderScene(x,cw,ch,{x:(b[0]+b[2])/2,y:(b[1]+b[3])/2,z},{grid:false,bg:white?"#FFFFFF":cssv("--canvas"),sel:false,ents:ents(),lineScale:Math.max(1,z/0.5)});isDark=keep;return c;}
async function doExport(f,dim,white){const nm=safeName();

  if(f==="pdf"){await loadScript("lib/jspdf.umd.min.js");const c=rasterize(2,white);const land=c.width>=c.height;const pdf=new window.jspdf.jsPDF({orientation:land?"landscape":"portrait",unit:"mm",format:"a3"});const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),m=12;const r=Math.min((pw-2*m)/c.width,(ph-2*m-10)/c.height);
    pdf.addImage(c.toDataURL("image/jpeg",0.92),"JPEG",(pw-c.width*r)/2,m+Math.max(0,(ph-2*m-10-c.height*r)/2),c.width*r,c.height*r);

    const fh=4.4;pdf.addImage(fc.toDataURL("image/png"),"PNG",m,ph-m+4-fh*0.74,fc.width/fc.height*fh,fh);await saveFile(nm+".pdf",pdf.output("blob"));return;}
  if(f==="dxf"){const outl=await wallUnion(dim==="3d");const txt=buildDXF(dim==="3d",outl);await saveFile(nm+".dxf",new Blob([txt],{type:"application/dxf"}));}}

function asciiName(n){return n.replace(/Ç/g,"C").replace(/Ğ/g,"G").replace(/İ/g,"I").replace(/Ö/g,"O").replace(/Ş/g,"S").replace(/Ü/g,"U").replace(/[^A-Z0-9_\- ]/gi,"_");}
async function wallUnion(threeD){const walls=ents().filter(e=>e.type==="wall"&&visible(e));if(!walls.length)return [];
  try{await loadScript("lib/polygon-clipping.umd.min.js");}catch(e){return null;}
  const pc=window.polygonClipping;if(!pc)return null;const rd=v=>Math.round(v*100)/100;const groups=new Map();
  for(const w of walls){const h=threeD?(+w.height||280):0;const key=w.layer+"|"+h;if(!groups.has(key))groups.set(key,{layer:w.layer,h,polys:[]});
    for(const r of wallPolys(w)){const ring=r.map(p=>[rd(p[0]),rd(p[1])]);ring.push(ring[0].slice());groups.get(key).polys.push([ring]);}}
  const out=[];try{for(const g of groups.values()){if(!g.polys.length)continue;const mp=pc.union(...g.polys);out.push({layer:g.layer,h:g.h,mp});}}catch(e){return null;}
  return out;}
function cleanRing(r){let p=r.slice();if(p.length>1&&dist(p[0],p[p.length-1])<0.01)p.pop();let changed=true;
  while(changed&&p.length>3){changed=false;for(let i=0;i<p.length;i++){const a=p[(i-1+p.length)%p.length],b=p[i],c=p[(i+1)%p.length];const cr=(b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0]);if(dist(a,b)<0.01||Math.abs(cr)<0.01*Math.max(1,dist(a,c))){p.splice(i,1);changed=true;break;}}}

    parts.push(new Uint8Array(lh.buffer),nm,d);const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint32(16,crc,true);ch.setUint32(20,d.length,true);ch.setUint32(24,d.length,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);central.push(new Uint8Array(ch.buffer),nm);off+=30+nm.length+d.length;}

    else{for(const pr of prims(e)){const pts=pr.k==="c"?arcPts(pr.c,pr.r,0,2*Math.PI,48):pr.k==="l"?[pr.a,pr.b]:(pr.closed?pr.pts.concat([pr.pts[0]]):pr.pts);const geo=new THREE.BufferGeometry().setFromPoints(pts.map(p=>new THREE.Vector3(p[0],1,p[1])));scene.add(new THREE.Line(geo,lineMat));}}}
  const b=extents(ents());const cx=(b[0]+b[2])/2,cz=(b[1]+b[3])/2,size=Math.max(b[2]-b[0],b[3]-b[1],500);
  const gridH=new THREE.GridHelper(Math.ceil(size*2/100)*100,Math.ceil(size*2/100),new THREE.Color(cssv("--grid-strong")),new THREE.Color(cssv("--grid")));gridH.position.set(cx,0,cz);scene.add(gridH);
  let th=-0.8,ph=0.9,rr=size*1.6;const target=new THREE.Vector3(cx,60,cz);
  const place=()=>{cam.position.set(target.x+rr*Math.cos(ph)*Math.cos(th),target.y+rr*Math.sin(ph),target.z+rr*Math.cos(ph)*Math.sin(th));cam.lookAt(target);};
  const resize=()=>{const w=canvas.clientWidth,h=canvas.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();};
  const home={th,ph,rr,t:target.clone()};let goal=null;// smooth camera moves for the buttons
  const animTo=(g)=>{goal=Object.assign({th,ph,rr,t:target.clone()},g);};
  // pan: move the look-at point in the camera's screen plane (works at any angle)
  const pan=(dx,dy)=>{const k=rr*0.0016;const right=new THREE.Vector3(-Math.sin(th),0,Math.cos(th));const fwd=new THREE.Vector3(-Math.cos(th),0,-Math.sin(th));
    target.addScaledVector(right,-dx*k);target.addScaledVector(fwd,dy*k*(ph>1.2?1:1/Math.max(0.35,Math.sin(ph))));goal=null;};
  const ptrs=new Map();let pd=0,pm=null,btn=0;
  canvas.addEventListener("pointerdown",e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);btn=e.button;goal=null;if(ptrs.size===2){const v=[...ptrs.values()];pd=Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1]);pm=[(v[0][0]+v[1][0])/2,(v[0][1]+v[1][1])/2];}});
  canvas.addEventListener("pointermove",e=>{if(!ptrs.has(e.pointerId))return;const prev=ptrs.get(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);const dx=e.clientX-prev[0],dy=e.clientY-prev[1];
    if(ptrs.size===1){if(btn===1||btn===2||e.shiftKey)pan(dx,dy);else{th+=dx*0.006;ph=clamp(ph+dy*0.005,0.05,1.55);}}
    else if(ptrs.size===2){const v=[...ptrs.values()];const d=Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1]),m=[(v[0][0]+v[1][0])/2,(v[0][1]+v[1][1])/2];if(pd)rr=clamp(rr*pd/d,60,size*10);if(pm)pan(m[0]-pm[0],m[1]-pm[1]);pd=d;pm=m;}});
  const up=e=>{ptrs.delete(e.pointerId);pd=0;pm=null;if(ptrs.size===1){}};canvas.addEventListener("pointerup",up);canvas.addEventListener("pointercancel",up);
  canvas.addEventListener("contextmenu",e=>e.preventDefault());
  canvas.addEventListener("wheel",e=>{e.preventDefault();goal=null;rr=clamp(rr*Math.exp(e.deltaY*0.001),60,size*10);},{passive:false});
  canvas.addEventListener("dblclick",()=>animTo({rr:rr*0.6}));
  const B=id=>root.querySelector(id);
  B("#v3in").onclick=()=>animTo({rr:clamp(rr*0.7,60,size*10)});B("#v3out").onclick=()=>animTo({rr:clamp(rr/0.7,60,size*10)});
  B("#v3top").onclick=()=>animTo({ph:1.55});B("#v3rotl").onclick=()=>animTo({th:th-Math.PI/4});B("#v3rotr").onclick=()=>animTo({th:th+Math.PI/4});
  B("#v3home").onclick=()=>animTo({th:home.th,ph:home.ph,rr:home.rr,t:home.t.clone()});
  const esc3=e=>{if(e.key==="Escape"&&document.body.contains(root))B("#v3close").click();};document.addEventListener("keydown",esc3);
  const loop=()=>{if(goal){const f=0.2;th+=(goal.th-th)*f;ph+=(goal.ph-ph)*f;rr+=(goal.rr-rr)*f;target.lerp(goal.t,f);if(Math.abs(goal.th-th)+Math.abs(goal.ph-ph)<1e-3&&Math.abs(goal.rr-rr)<1&&target.distanceTo(goal.t)<1)goal=null;}
    resize();place();R.render(scene,cam);root._raf=requestAnimationFrame(loop);};loop();
  B("#v3close").onclick=()=>{cancelAnimationFrame(root._raf);document.removeEventListener("keydown",esc3);try{R.dispose();}catch(e){}root.remove();draw();};}

/* ================= home ================= */
function homeVisible(){return !$("#home").hidden;}
function thumb(c,p){const r=c.getBoundingClientRect();const dpr=window.devicePixelRatio||1;const w=Math.max(200,r.width),h=w*3/4;c.width=w*dpr;c.height=h*dpr;const x=c.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);
  const keep=S.proj;S.proj=p;const b=extents(p.ents);const z=Math.min(w/(b[2]-b[0]+200),h/(b[3]-b[1]+200));renderScene(x,w,h,{x:(b[0]+b[2])/2,y:(b[1]+b[3])/2,z},{grid:false,bg:cssv("--canvas"),sel:false,ents:p.ents});S.proj=keep;}
let homeList=[];
async function renderHome(){const box=$("#projList");const list=(await listProjects()).sort((a,b)=>(b.updated||0)-(a.updated||0));homeList=list;
  const items=list.length?list:[Object.assign(sampleProject(),{isSample:true})];if(!list.length)homeList=items;
  box.innerHTML='<button class="card new" type="button" id="cardNew">'+ico("plus")+'<span>Yeni proje</span></button>'+items.map((p,i)=>'<div class="cardw"><button class="card" type="button" data-i="'+i+'"><canvas aria-hidden="true"></canvas><span class="meta"><strong>'+esc(p.name)+(p.isSample?'<span class="chip">Örnek</span>':"")+'</strong><span>'+(p.ents||[]).length+' eleman · '+new Date(p.updated||Date.now()).toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"})+'</span></span></button>'+(p.isSample?"":'<button class="ren" type="button" data-r="'+i+'" aria-label="Proje adını değiştir"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg></button>')+'</div>').join("");
  box.querySelectorAll(".ren").forEach(b=>b.onclick=()=>renameModal(items[+b.dataset.r]));
  box.querySelectorAll(".card[data-i]").forEach(c=>{const p=items[+c.dataset.i];thumb(c.querySelector("canvas"),p);let t=null,sx=0,sy=0;
    const clear=()=>{clearTimeout(t);t=null;c.classList.remove("pressing");};
    c.addEventListener("pointerdown",e=>{if(p.isSample)return;sx=e.clientX;sy=e.clientY;c.classList.add("pressing");t=setTimeout(()=>{clear();c._lp=true;confirmDelete(p);},600);});
    c.addEventListener("pointermove",e=>{if(t&&Math.hypot(e.clientX-sx,e.clientY-sy)>10)clear();});
    ["pointerup","pointerleave","pointercancel"].forEach(ev=>c.addEventListener(ev,clear));
    c.addEventListener("contextmenu",e=>{e.preventDefault();if(!p.isSample&&!c._lp){c._lp=true;confirmDelete(p);}});
    c.onclick=()=>{if(c._lp){c._lp=false;return;}openProject(p);};});
  $("#cardNew").onclick=()=>openProject(newProject());
  $("#storeNote").textContent=(storeKind==="db"?"Projeler bu tablette saklanıyor.":"Projeler bu cihazın tarayıcısında saklanıyor.")+(list.length?" Silmek için projeye basılı tut.":"");}
$("#newProj").onclick=()=>openProject(newProject());
function renameModal(p){modal('<h2>Proje adı</h2><div class="mrow"><label for="rnIn">Firma ya da proje adı</label><input id="rnIn" type="text" maxlength="80" value="'+esc(p.name)+'" style="height:48px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:0 12px;font-size:16px"></div><div class="mfoot"><button class="btn" type="button" id="rnNo">Vazgeç</button><button class="btn primary" type="button" id="rnOk">Kaydet</button></div>',close=>{
  const inp=$("#rnIn");setTimeout(()=>{inp.focus();inp.select();},50);
  const save=async()=>{const nm=inp.value.trim();if(!nm){toast("Ad boş olamaz");return;}close();p.name=nm;p.updated=Date.now();
    if(DB){try{await DB.doc("projects/"+p.id).update({name:nm,updated:p.updated});}catch(e){try{await DB.doc("projects/"+p.id).set(p);}catch(err){toast("Kaydedilemedi");}}}else if(!lsPut(p))toast("Kaydedilemedi");
    renderHome();toast("Ad kaydedildi");};
  $("#rnNo").onclick=close;$("#rnOk").onclick=save;inp.addEventListener("keydown",e=>{if(e.key==="Enter")save();});});}
function confirmDelete(p){modal('<h2>Projeyi sil</h2><p>“'+esc(p.name)+'” ve içindeki tüm çizimler silinecek. Bu işlem geri alınamaz.</p><div class="mfoot"><button class="btn" type="button" id="dNo">Vazgeç</button><button class="btn primary" type="button" id="dYes">'+ico("trash")+'Sil</button></div>',close=>{
  $("#dNo").onclick=close;$("#dYes").onclick=async()=>{close();await deleteProject(p.id,p);toast("Proje silindi");renderHome();};});}
async function openProject(p){if(p.isSample){p=JSON.parse(JSON.stringify(p));delete p.isSample;delete p.sample;}
  await loadImages(p);S.proj=p;S.view=Object.assign({x:300,y:200,z:.5},p.view||{});S.sel.clear();S.undo=[];S.redo=[];S.draft=null;S.cmd=null;S.tool="select";S.tab="el";
  $("#home").hidden=true;$("#editor").hidden=false;$("#pname").value=p.name;renderDock();renderCtx();refreshPanels();updUndo();updStatus();$("#layers").hidden=true;
  lastAng=scrAngle();updUnrot();
  requestAnimationFrame(()=>{if(!p.view||!p.ents.length)S.view={x:300,y:200,z:.5,r:S.view.r||0};if(p.ents.length&&!p.view)fitView();draw();});markDirty();}
$("#pname").addEventListener("change",e=>{S.proj.name=e.target.value.trim()||"Adsız proje";markDirty();});
$("#btnHome").onclick=async()=>{S.proj.view=Object.assign({},S.view);clearTimeout(saveTimer);await saveNow();S.proj=null;$("#editor").hidden=true;$("#home").hidden=false;$("#modalRoot").innerHTML="";renderHome();};
$("#btnUndo").onclick=undo;$("#btnRedo").onclick=redo;
setInterval(()=>{if(S.proj){S.proj.view=Object.assign({},S.view);}},2000);

new ResizeObserver(()=>{const h=$("#topstack").getBoundingClientRect().height;$("#editor").style.setProperty("--topH",Math.round(h)+"px");}).observe($("#topstack"));
function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement;}
function updFull(){const b=$("#btnFull");const on=!!fsEl();b.innerHTML=ico(on?"unfull":"full");b.setAttribute("aria-label",on?"Tam ekrandan çık":"Tam ekran");setTimeout(draw,60);}
$("#btnFull").onclick=async()=>{try{if(fsEl()){await (document.exitFullscreen||document.webkitExitFullscreen).call(document);}else{const el=document.documentElement;const req=el.requestFullscreen||el.webkitRequestFullscreen;if(!req)throw 0;await req.call(el,{navigationUI:"hide"});}}catch(e){fullHelp();}};
document.addEventListener("fullscreenchange",updFull);document.addEventListener("webkitfullscreenchange",updFull);
function fullHelp(){modal('<h2>Tam ekran bu görünümde açılmıyor</h2><p>Claude uygulamasının içindeki pencere tam ekrana izin vermiyor. Tabletinde bağlantıyı Chrome ya da Huawei Tarayıcı ile açıp bu butona yeniden bas; tarayıcıda tam ekran çalışır.</p><p>Tarayıcı menüsünden “Ana ekrana ekle” dersen FourmisDraw uygulama simgesiyle açılır.</p><div class="mfoot"><button class="btn primary" type="button" id="fOk">Tamam</button></div>',close=>{$("#fOk").onclick=close;});}
function scrAngle(){const a=(screen.orientation&&typeof screen.orientation.angle==="number")?screen.orientation.angle:(typeof window.orientation==="number"?window.orientation:0);return ((a%360)+360)%360;}
let lastAng=scrAngle();
function updUnrot(){const r=S.view.r||0;$("#btnUnrot").hidden=!(S.proj&&Math.abs(Math.sin(r/2))>1e-3);}
function onOrient(){const a=scrAngle();let d=a-lastAng;lastAng=a;if(d&&typeof UIR!=="undefined"&&UIR.follow){UIR.off=((UIR.off+UIR.deg)%360+360)%360;setUIRot(0,true);layoutUI();kbLock();}if(!d||!S.proj||!SET.lockRot)return;S.view.r=((S.view.r||0)-rad(d))%(2*Math.PI);updUnrot();setTimeout(draw,50);setTimeout(draw,350);}
if(screen.orientation&&screen.orientation.addEventListener)screen.orientation.addEventListener("change",onOrient);else window.addEventListener("orientationchange",onOrient);
$("#btnUnrot").onclick=()=>{S.view.r=0;updUnrot();draw();};
/* ---- keep the canvas only while a project is open ---- */
new MutationObserver(()=>{cv.hidden=$("#editor").hidden;if(!cv.hidden)draw();}).observe($("#editor"),{attributes:true,attributeFilter:["hidden"]});
/* ---- app (screen locked): the plan never turns; only the menus follow the tablet ---- */
var UIR={deg:0,base:null,q:null,off:0,follow:0};
function layoutUI(){const ui=$("#ui"),W=window.innerWidth,H=window.innerHeight,side=Math.abs(UIR.deg)%180===90;const w=side?H:W,h=side?W:H;
  ui.style.width=w+"px";ui.style.height=h+"px";ui.style.left=((W-w)/2)+"px";ui.style.top=((H-h)/2)+"px";ui.style.transform=UIR.deg?"rotate("+UIR.deg+"deg)":"";}
function setUIRot(deg,quiet){if(deg===UIR.deg)return;const ui=$("#ui");if(!quiet)ui.classList.add("anim");UIR.deg=deg;layoutUI();clearTimeout(UIR.t);UIR.t=setTimeout(()=>ui.classList.remove("anim"),400);if(S.proj)draw();}
/* typing while the menus are turned: the system keyboard only knows the screen, so the screen is let to
   follow the tablet once (the plan is counter-rotated by onOrient) and then locked again in the new position */
function kbFollow(){if(!window.FDOrient||!UIR.deg||UIR.follow)return;UIR.follow=Date.now();FDOrient.postMessage("follow");
  clearTimeout(UIR.ft);UIR.ft=setTimeout(kbLock,1800);}
function kbLock(){if(!UIR.follow)return;clearTimeout(UIR.ft);try{FDOrient.postMessage("lock");}catch(e){}setTimeout(()=>{UIR.follow=0;},600);}
document.addEventListener("focusin",e=>{const t=e.target;if(t&&(t.tagName==="TEXTAREA"||(t.tagName==="INPUT"&&!/^(checkbox|radio|range|button|submit|file|color)$/.test(t.type))))kbFollow();});
if(window.FD_NATIVE&&window.FDLocked){
  window.addEventListener("devicemotion",e=>{const g=e.accelerationIncludingGravity;if(!g||g.x==null)return;const gx=g.x,gy=g.y;if(Math.hypot(gx,gy)<4)return;// lying flat: keep as is
    const a=Math.atan2(gx,gy)*180/Math.PI;let q=Math.round(a/90)*90;if(Math.abs(a-q)>30)return;q=((q%360)+360)%360;// dead zone between quadrants
    if(UIR.base==null)UIR.base=q;if(UIR.follow)return;if(!SET.lockRot){setUIRot(0);return;}let d=((q-UIR.base-UIR.off)%720+720)%360;if(d===270)d=-90;setUIRot(d);});
  window.addEventListener("resize",layoutUI);}
/* ================= boot ================= */
applyTheme();renderHome();
(async()=>{try{const db=window.claude&&window.claude.use?await window.claude.use("db"):null;if(db){DB=db;storeKind="db";
  // carry over projects saved locally before the store was reachable
  const local=lsAll();for(const p of local){try{await DB.doc("projects/"+p.id).set(p);}catch(e){}}if(local.length){try{localStorage.removeItem(LS_KEY);}catch(e){}}
  if(homeVisible())renderHome();}}catch(e){}})();
})();
</script>
