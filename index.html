<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><style>:root{color-scheme:light}body{margin:0;font-family:system-ui,sans-serif;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>FourmisDraw</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>@font-face{font-family:'Montserrat';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/montserrat-latin-ext-600-normal.woff2) format('woff2')}@font-face{font-family:'Montserrat';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/montserrat-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'Montserrat';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/montserrat-latin-ext-700-normal.woff2) format('woff2')}@font-face{font-family:'Montserrat';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/montserrat-latin-700-normal.woff2) format('woff2')}@font-face{font-family:'Montserrat';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/montserrat-latin-ext-800-normal.woff2) format('woff2')}@font-face{font-family:'Montserrat';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/montserrat-latin-800-normal.woff2) format('woff2')}@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-latin-ext-400-normal.woff2) format('woff2')}@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-sans-latin-ext-500-normal.woff2) format('woff2')}@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-sans-latin-500-normal.woff2) format('woff2')}@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-latin-ext-600-normal.woff2) format('woff2')}@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-mono-latin-ext-400-normal.woff2) format('woff2')}@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-ext-500-normal.woff2) format('woff2')}@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2')}</style>
<style>
/* Layout: full-bleed drawing surface; floating panels — context bar top, properties/layers right, command dock bottom-right */
:root{
  --bg:#EEF0F4; --surface:#FFFFFF; --surface-2:#F5F6F9; --line:#D6DAE3; --fg:#13213F; --muted:#5B6479;
  --accent:#E8343C; --accent-fg:#FFFFFF; --navy:#13213F; --sel:#1F6FEB; --canvas:#F7F8FA; --grid:#DCE0E8; --grid-strong:#BCC3D1;
  --shadow:0 6px 24px rgba(19,33,63,.12),0 1px 3px rgba(19,33,63,.10);
  --f-display:"Montserrat",system-ui,sans-serif; --f-ui:"IBM Plex Sans",system-ui,sans-serif; --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1222; --surface:#151E33; --surface-2:#1B2640; --line:#2A3654; --fg:#E9EDF5; --muted:#9AA4BC;
  --accent:#F0474F; --accent-fg:#FFFFFF; --navy:#E9EDF5; --sel:#5B9BFF; --canvas:#0E1628; --grid:#1C2740; --grid-strong:#2C3A5C; color-scheme:dark;
  --shadow:0 6px 24px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#0B1222; --surface:#151E33; --surface-2:#1B2640; --line:#2A3654; --fg:#E9EDF5; --muted:#9AA4BC;
  --accent:#F0474F; --accent-fg:#FFFFFF; --navy:#E9EDF5; --sel:#5B9BFF; --canvas:#0E1628; --grid:#1C2740; --grid-strong:#2C3A5C; color-scheme:dark;
  --shadow:0 6px 24px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.4);
}
/* app-level theme setting overrides the host */
html.app-light{
  --bg:#EEF0F4; --surface:#FFFFFF; --surface-2:#F5F6F9; --line:#D6DAE3; --fg:#13213F; --muted:#5B6479;
  --accent:#E8343C; --navy:#13213F; --sel:#1F6FEB; --canvas:#F7F8FA; --grid:#DCE0E8; --grid-strong:#BCC3D1; color-scheme:light;
  --shadow:0 6px 24px rgba(19,33,63,.12),0 1px 3px rgba(19,33,63,.10);
}
html.app-dark{
  --bg:#0B1222; --surface:#151E33; --surface-2:#1B2640; --line:#2A3654; --fg:#E9EDF5; --muted:#9AA4BC;
  --accent:#F0474F; --navy:#E9EDF5; --sel:#5B9BFF; --canvas:#0E1628; --grid:#1C2740; --grid-strong:#2C3A5C; color-scheme:dark;
  --shadow:0 6px 24px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.4);
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- HOME ---------- */
#home{height:100%;overflow:auto;padding-block:32px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.home-in{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:46px;height:auto}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:-.01em}
.brand h1 b{color:var(--accent);font-weight:700}
.home-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px}
.home-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--accent)}
.sec-title{margin:0;font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.grid-proj{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.cardw{position:relative;display:flex}.cardw>.card{flex:1;min-width:0}
.card .meta strong{padding-right:44px;overflow-wrap:anywhere}
.ren{position:absolute;right:6px;bottom:8px;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;background:transparent;color:var(--muted)}
.ren:hover{background:var(--surface-2);color:var(--fg)}
.card{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;transition:transform .15s;display:flex;flex-direction:column;border-radius:14px;border:1px solid var(--line);background:var(--surface);overflow:hidden;text-align:left;padding:0}
.card:hover{border-color:var(--muted)}
.card.pressing{transform:scale(.97)}
.card canvas{width:100%;aspect-ratio:4/3;display:block;background:var(--canvas)}
.card .meta{display:flex;flex-direction:column;gap:2px;padding:12px 14px}
.card .meta strong{font-weight:600;font-size:15px}
.card .meta span{color:var(--muted);font-size:12.5px}
.card.new{align-items:center;justify-content:center;min-height:220px;border-style:dashed;gap:10px;color:var(--muted);background:transparent}
.card.new svg.i{width:32px;height:32px}
.chip{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted);margin-left:6px;vertical-align:2px}
.empty-note{color:var(--muted);margin:0}

/* ---------- EDITOR ---------- */
#editor{position:fixed;inset:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#editor input{-webkit-user-select:text;user-select:text}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;background:var(--canvas)}
.float{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.topstack{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:3}
.toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;width:100%;flex-wrap:wrap;pointer-events:none}
.toprow>.float,.topstack>.float{position:relative;pointer-events:auto}
.topbar{display:flex;align-items:center;gap:4px;padding:4px;flex:1 1 260px;min-width:0;max-width:440px}
.topbar .pname{border:0;background:transparent;font-weight:600;font-size:15px;flex:1 1 auto;min-width:60px;width:auto;padding:8px 6px;border-radius:8px;text-overflow:ellipsis}
.topbar .pname:hover,.topbar .pname:focus{background:var(--surface-2)}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;height:44px;padding:0 10px;border:0;border-radius:10px;background:transparent;font-size:13px;font-weight:500}
.ib:hover{background:var(--surface-2)}
.ib[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.ib:disabled{opacity:.35;cursor:default}
.ib .lbl{white-space:nowrap}
.sep{width:1px;height:26px;background:var(--line);margin:0 2px}
.topright{display:flex;gap:2px;padding:4px;flex:none;margin-left:auto}
.ctx{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:6px 10px;max-width:100%}
.ctx .xbtn{min-width:40px;height:40px;padding:0;border:1px solid var(--line);background:var(--surface-2);border-radius:10px}
.ctx:empty{display:none}
.ctx .t{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.ctx .hint{color:var(--muted);font-size:13px}
.fld{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.fld input[type=number],.fld input[type=text],.fld select{width:76px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:0 8px;color:var(--fg);font-family:var(--f-num)}
.fld select{width:auto;font-family:var(--f-ui)}
.fld .u{font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;height:38px;padding:0 12px;font-size:13px;font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.sbtn{height:38px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;font-weight:600}
.sbtn.go{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.readout{font-family:var(--f-num);font-size:12.5px;color:var(--muted)}

.dock{right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;padding:8px;width:min(440px,calc(100vw - 24px))}
.tabs{display:flex;gap:4px}
.tabs button{flex:1;height:38px;border:0;border-radius:8px;background:transparent;font-family:var(--f-display);font-weight:700;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface-2);color:var(--fg)}
.tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:60px;border:1px solid transparent;border-radius:10px;background:transparent;font-size:12px;font-weight:500;padding:6px 2px}
.tool:hover{background:var(--surface-2)}
.tool[aria-pressed="true"]{border-color:var(--accent);background:var(--surface-2);color:var(--accent)}
.tool svg.i{width:24px;height:24px}
.snaps{display:flex;gap:6px;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.snaps .lab{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:auto}
.tog{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:12.5px;font-weight:600}
.tog[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.side{right:max(12px,env(safe-area-inset-right,0px));top:calc(var(--topH,60px) + 18px + env(safe-area-inset-top,0px));width:min(300px,calc(100vw - 24px));max-height:calc(100% - var(--topH,60px) - 330px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:160px;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.side h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.side .row{display:grid;grid-template-columns:110px minmax(0,1fr);align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.side .row input,.side .row select{height:38px;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:0 8px;color:var(--fg);font-family:var(--f-num)}
.side .row select{font-family:var(--f-ui)}
.side .row input[type=range]{padding:0;accent-color:var(--accent);background:transparent;border:0}
.cmds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cmds button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:12px;min-height:56px}
.cmds button.del{color:var(--accent)}
.lay{display:grid;grid-template-columns:28px 44px 44px 30px minmax(0,1fr) 36px;align-items:center;gap:2px;padding:2px 4px;border-radius:8px}
.lay.cur{background:var(--surface-2)}
.lay input[type=radio]{accent-color:var(--accent);width:18px;height:18px}
.lay .nm{border:0;background:transparent;height:34px;padding:0 6px;border-radius:6px;font-family:var(--f-num);font-size:13px;width:100%}
.lay .nm:focus{background:var(--surface)}
.lay .sw{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);padding:0}
.lay .ib{min-width:40px;height:40px;padding:0}
.lay .ib.off{opacity:.4}
.lay-head{display:grid;grid-template-columns:28px 44px 44px 30px minmax(0,1fr) 36px;gap:2px;padding:0 4px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.status{left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:6px 10px;font-size:12px;color:var(--muted);display:flex;gap:12px;border-radius:10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:50;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}

/* ---------- MODALS ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,12,24,.45);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:min(480px,100%);max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.modal h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:20px}
.modal p{margin:0;color:var(--muted);line-height:1.5}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:72px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);font-weight:600}
.opt small{font-weight:400;color:var(--muted);font-size:11.5px}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mrow{display:flex;flex-direction:column;gap:8px}
.mrow > label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mfoot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:10px;min-height:40px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
#v3d{position:fixed;inset:0;z-index:45;background:var(--canvas)}
#v3d canvas{display:block;width:100%;height:100%;touch-action:none}
#v3d .float{z-index:2}
@media (max-width:720px){
  .ib .lbl{display:none}
  .dock{width:calc(100vw - 24px)}
  .side{max-height:calc(100% - var(--topH,60px) - 330px)}
  .status{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div id="home">

let DB=null, storeKind="local";
const LS_KEY="fd_projects";

async function listProjects(){
  if(DB){try{const snap=await DB.collection("projects").get();return snap.docs.map(d=>d.data()).filter(Boolean).map(x=>JSON.parse(JSON.stringify(x)));}catch(e){}}

async function loadImages(p){
  for(const e of p.ents){if(e.type!=="image"||e.src)continue;
    if(DB){try{const d=await DB.doc("projects/"+p.id+"/img/"+e.id).get();if(d.exists)e.src=d.data().src;}catch(err){}}
    else{try{e.src=localStorage.getItem("fd_img_"+e.id)||"";}catch(err){}}}
}
let saveTimer=null;
function markDirty(){if(!S.proj)return;S.proj.updated=Date.now();clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,700);}
async function saveNow(){const p=S.proj;if(!p)return;const doc=slim(p);
  if(DB){try{await DB.doc("projects/"+p.id).set(doc);}catch(e){toast("Kaydedilemedi: "+(e.message||e.code));}}

async function saveImage(e){

  else{try{localStorage.setItem("fd_img_"+e.id,e.src);}catch(err){toast("Altlık bu cihazda saklanamadı");}}

async function deleteProject(id,p){const imgs=((p||S.proj||{}).ents||[]).filter(e=>e.type==="image");
  if(DB){try{await DB.doc("projects/"+id).delete();}catch(e){}for(const im of imgs){try{await DB.doc("projects/"+id+"/img/"+im.id).delete();}catch(e){}}}

/* ================= geometry: walls ================= */
function wallLen(e){return Math.hypot(e.x2-e.x1,e.y2-e.y1);}
function wallDir(e){const L=wallLen(e)||1;return [(e.x2-e.x1)/L,(e.y2-e.y1)/L];}
function endExt(e,pt){let ext=0;for(const o of ents()){if(o===e||o.type!=="wall"||!visible(o))continue;
  if(dist(pt,[o.x1,o.y1])<1.5||dist(pt,[o.x2,o.y2])<1.5){ext=Math.max(ext,o.thick/2);continue;}
  const r=projSeg(pt,[o.x1,o.y1],[o.x2,o.y2]);if(r.t>0.0005&&r.t<0.9995&&dist(pt,r.pt)<=o.thick/2+1)ext=Math.max(ext,o.thick/2);}return ext;}
function wallOpenings(e){const L=wallLen(e),u=wallDir(e),out=[];
  for(const d of ents()){if(d.type!=="door"||d.wallId!==e.id||!visible(d))continue;const t=(d.x-e.x1)*u[0]+(d.y-e.y1)*u[1];out.push([clamp(t-d.width/2,0,L),clamp(t+d.width/2,0,L)]);}
  out.sort((a,b)=>a[0]-b[0]);return out;}
function wallSegs(e){ // solid pieces [s0,s1] along axis, with extension
  const L=wallLen(e),e0=endExt(e,[e.x1,e.y1]),e1=endExt(e,[e.x2,e.y2]);let segs=[[-e0,L+e1]];
  for(const o of wallOpenings(e)){const n=[];for(const s of segs){if(o[1]<=s[0]||o[0]>=s[1]){n.push(s);continue;}if(o[0]>s[0])n.push([s[0],o[0]]);if(o[1]<s[1])n.push([o[1],s[1]]);}segs=n;}
  return segs.filter(s=>s[1]-s[0]>0.5);}
function wallRect(e,s0,s1){const u=wallDir(e),n=[-u[1],u[0]],h=e.thick/2,p=s=>[e.x1+u[0]*s,e.y1+u[1]*s];const a=p(s0),b=p(s1);
  return [[a[0]+n[0]*h,a[1]+n[1]*h],[b[0]+n[0]*h,b[1]+n[1]*h],[b[0]-n[0]*h,b[1]-n[1]*h],[a[0]-n[0]*h,a[1]-n[1]*h]];}
function wallPolys(e){return wallSegs(e).map(s=>wallRect(e,s[0],s[1]));}

/* ================= geometry: primitives for doors / stairs / others ================= */
// prim: {k:"l",a,b} | {k:"p",pts,closed} | {k:"c",c,r} ; all world coords
function xf(e,pts){const c=Math.cos(e.ang||0),s=Math.sin(e.ang||0);return pts.map(p=>[e.x+p[0]*c-p[1]*s,e.y+p[0]*s+p[1]*c]);}
function doorLocal(d){const w=d.width,t=d.thick||20,s=d.flip||1,h=d.hand||1,P=[];const face=s*t/2;
  if(d.kind==="single"){const hx=-h*w/2;P.push({k:"p",pts:[[hx,face],[hx,face+s*w]]});
    P.push({k:"p",pts:swingArc([hx,face],w,[hx,face+s*w],[-hx,face])});}
  else if(d.kind==="double"){const q=w/2;P.push({k:"p",pts:[[-q,face],[-q,face+s*q]]},{k:"p",pts:[[q,face],[q,face+s*q]]});
    P.push({k:"p",pts:swingArc([-q,face],q,[-q,face+s*q],[0,face])},{k:"p",pts:swingArc([q,face],q,[q,face+s*q],[0,face])});}
  else if(d.kind==="sliding"){const o=t/6;P.push({k:"p",pts:[[-w/2,-o-3],[w*0.1,-o-3],[w*0.1,-o+3],[-w/2,-o+3]],closed:true},{k:"p",pts:[[-w*0.1,o-3],[w/2,o-3],[w/2,o+3],[-w*0.1,o+3]],closed:true});}
  else if(d.kind==="industrial"){const f2=face+s*12;P.push({k:"p",pts:[[-w/2,face],[w/2,face],[w/2,f2],[-w/2,f2]],closed:true});P.push({k:"l",a:[-w/2,face],b:[w/2,f2]});P.push({k:"l",a:[w/2,face],b:[-w/2,f2]});}
  return P;}
function swingArc(c,r,from,to){const a0=Math.atan2(from[1]-c[1],from[0]-c[0]);let a1=Math.atan2(to[1]-c[1],to[0]-c[0]);let d=a1-a0;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return arcPts(c,r,a0,a0+d,12);}

  if(e.kind==="straight"){const Lx=n*gd;R([[0,0],[Lx,0],[Lx,W],[0,W]],true);for(let i=1;i<n;i++)Ln([i*gd,0],[i*gd,W]);arrow([[gd/2,W/2],[Lx-gd/2,W/2]]);}

  else if(e.kind==="U"){const gap=e.gap??10,n1=clamp(Math.round(e.n1||Math.ceil(n/2)),1,n-1),n2=n-n1,X=n1*gd;R([[0,0],[X,0],[X,W],[0,W]],true);for(let i=1;i<n1;i++)Ln([i*gd,0],[i*gd,W]);R([[X,0],[X+Lg,0],[X+Lg,2*W+gap],[X,2*W+gap]],true);const x0=X-n2*gd;R([[x0,W+gap],[X,W+gap],[X,2*W+gap],[x0,2*W+gap]],true);for(let i=1;i<n2;i++)Ln([X-i*gd,W+gap],[X-i*gd,2*W+gap]);arrow([[gd/2,W/2],[X+Lg/2,W/2],[X+Lg/2,W+gap+W/2],[x0+gd/2,W+gap+W/2]]);}
  else if(e.kind==="spiral"){const ri=e.ri||15,ro=W+ri,sw=e.sweep||Math.min(2*Math.PI,n*rad(22.5));if(sw>=2*Math.PI-1e-6){R(arcPts([0,0],ro,0,2*Math.PI,48),true);R(arcPts([0,0],ri,0,2*Math.PI,16),true);}else{R(arcPts([0,0],ro,0,sw,40),false);R(arcPts([0,0],ri,0,sw,16),false);}for(let i=0;i<=n;i++){const a=sw*i/n;if(i===n&&sw>=2*Math.PI-1e-6)break;Ln([ri*Math.cos(a),ri*Math.sin(a)],[ro*Math.cos(a),ro*Math.sin(a)]);}const am=arcPts([0,0],ri+W/2,sw/(2*n),sw-sw/(2*n),24);arrow(am);}
  return P;}
function customStairPrims(e){const pts=e.pts,W=+e.width||100,gd=+e.depth||28,P=[];if(!pts||pts.length<2)return P;
  const off=(sgn)=>pts.map((p,i)=>{const a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)];let dx=b[0]-a[0],dy=b[1]-a[1];const L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;let nx=-dy,ny=dx;let k=1;
    if(i>0&&i<pts.length-1){const d1=[p[0]-a[0],p[1]-a[1]],L1=Math.hypot(d1[0],d1[1])||1,n1=[-d1[1]/L1,d1[0]/L1];const cosh=n1[0]*nx+n1[1]*ny;k=1/Math.max(0.3,cosh);}

    f.treads=[];for(let t=1;t<=k;t++){const sv=f.start+t*sp;f.treads.push([f.Pt(sv,f.lc-W/2),f.Pt(sv,f.lc+W/2)]);}
    f.rect=[f.Pt(f.start,f.lc-W/2),f.Pt(f.end,f.lc-W/2),f.Pt(f.end,f.lc+W/2),f.Pt(f.start,f.lc+W/2)];
    f.entry=f.Pt(f.start,f.lc);f.exit=f.Pt(f.end,f.lc);f.n=k+1;f.width=W;
    if(i===0)arrow.push(f.Pt(f.start+sp/2,f.lc));else junction[i-1].forEach(p=>arrow.push(p));
    if(i===ordered.length-1)arrow.push(f.Pt(f.end-sp/2,f.lc));});
  const outlines=[];
  const n=ordered.reduce((s,f)=>s+f.n,0);const ent={kind:"sketch",flights:ordered.map(f=>({treads:f.treads,rect:f.rect,spacing:f.spacing,entry:f.entry,exit:f.exit,dirv:f.dirv,n:f.n})),landings,outlines,arrow,n,x:arrow[0][0],y:arrow[0][1],ang:0,m:1,width:ordered[0].width,depth:Math.round(ordered[0].spacing)};
  const bx=bbox(Object.assign({type:"stair"},ent));const kinds=ordered.length===1?"Tek kollu":ordered.length===2?"İki kollu":ordered.length+" kollu";
  return {ent,label:kinds+" merdiven · "+n+" basamak · basamak derinliği ≈ "+fmt(ordered[0].spacing)+" cm · "+fmt(bx[2]-bx[0])+" × "+fmt(bx[3]-bx[1])+" cm"};}
function trimAt(p){const tol=12/S.view.z;let target=null;
  for(const e of ents()){if((e.type!=="line"&&e.type!=="wall")||!editable(e))continue;let d=dist(p,projSeg(p,[e.x1,e.y1],[e.x2,e.y2]).pt);if(e.type==="wall")d=Math.max(0,d-e.thick/2);if(d<tol&&(!target||d<target.d))target={e,d};}
  if(!target){toast("Bir duvarın ya da çizginin silinecek parçasına dokun");return;}
  const e=target.e,a=[e.x1,e.y1],b=[e.x2,e.y2];const ts=[];
  for(const o of ents()){if(o===e||!visible(o)||o.type==="image"||o.type==="door"||o.type==="text")continue;const pr=o.type==="wall"?(e.type==="wall"?[{k:"l",a:[o.x1,o.y1],b:[o.x2,o.y2]}]:prims(o).concat([{k:"l",a:[o.x1,o.y1],b:[o.x2,o.y2]}])):prims(o);
    for(const x of pr){if(x.k==="c"){circInter(a,b,x.c,x.r).forEach(t=>{if(t>1e-6&&t<1-1e-6)ts.push(t);});continue;}for(const s of primSegs(x)){const t=segInter(a,b,s[0],s[1]);if(t!=null&&t>1e-6&&t<1-1e-6)ts.push(t);}}}
  const tp=projSeg(p,a,b).t;let lo=0,hi=1;for(const t of ts){if(t<tp&&t>lo)lo=t;if(t>tp&&t<hi)hi=t;}
  if(lo<1e-6&&hi>1-1e-6){toast("Bu parçayı kesen başka duvar ya da çizgi yok");return;}
  pushUndo();const idx=ents().indexOf(e);ents().splice(idx,1);S.sel.delete(e.id);let w1=null,w2=null;
  if(lo>1e-6){const q=lerp(a,b,lo);w1=Object.assign({},e,{id:uid(),x2:q[0],y2:q[1]});ents().push(w1);}
  if(hi<1-1e-6){const q=lerp(a,b,hi);w2=Object.assign({},e,{id:uid(),x1:q[0],y1:q[1]});ents().push(w2);}
  if(e.type==="wall"){const L=wallLen(e);const doors=ents().filter(d=>d.type==="door"&&d.wallId===e.id);for(const d of doors){const t=projSeg([d.x,d.y],a,b).t;if(t<lo&&w1)d.wallId=w1.id;else if(t>hi&&w2)d.wallId=w2.id;else ents().splice(ents().indexOf(d),1);}}
  markDirty();draw();}

function updateStairReadout(){const r=document.querySelector("#ctx .readout");if(r)r.textContent="Toplam: "+stairSize(S.opt.stair);}
function placeCmd(M){if(S.cmd.name==="copy"){const ids=S.cmd.ids.slice();S.sel=new Set(ids);applyToSel(M,true);S.sel=new Set(ids.filter(id=>byId(id)));refreshPanels();renderCtx();toast("Çoğaltıldı");return;}applyToSel(M,false);endCmd();}

function typedLength(L){const D=S.draft;let from=D&&D.kind==="chain"?D.start:D&&D.kind==="pts"?D.pts[D.pts.length-1]:null;if(!from){toast("Önce başlangıç noktasını seç");return;}
  let dir=S.cur?[S.cur[0]-from[0],S.cur[1]-from[1]]:[1,0];if(S.ortho)dir=Math.abs(dir[0])>=Math.abs(dir[1])?[Math.sign(dir[0])||1,0]:[0,Math.sign(dir[1])||1];const n=Math.hypot(dir[0],dir[1])||1;const p=[from[0]+dir[0]/n*L,from[1]+dir[1]/n*L];commitPoint(p);draw();}

/* ================= drawing actions ================= */
function commitPoint(p){const D=S.draft;
  if(S.tool==="wall"||S.tool==="line"){if(!D||!D.start){S.draft={kind:"chain",start:p,count:0};return;}
    if(dist(D.start,p)<0.5)return;pushUndo();
    if(S.tool==="wall"){const o=S.opt.wall;addEnt({type:"wall",layer:layerFor("DUVAR"),x1:D.start[0],y1:D.start[1],x2:p[0],y2:p[1],thick:+o.thick||20,height:o.height});}
    else addEnt({type:"line",layer:drawLayer(),x1:D.start[0],y1:D.start[1],x2:p[0],y2:p[1]});
    D.start=p;D.count++;return;}
  if(S.tool==="pline"||S.tool==="mline"||(S.tool==="stair"&&S.opt.stair.kind==="custom")){if(!D){S.draft={kind:"pts",pts:[p]};return;}const last=D.pts[D.pts.length-1];if(dist(last,p)<0.5)return;D.pts.push(p);return;}
}
function layerFor(def){const cur=S.proj.cur;return (cur==="0"||cur===def||!["DUVAR","KAPI","MERDIVEN"].includes(def))?(cur==="0"?def:cur):def;}
function finishDraft(){const D=S.draft;S.draft=null;if(!D||!S.proj)return;
  if(D.kind==="pts"){if(S.tool==="mline"&&D.pts.length>1){const o=S.opt.mline;pushUndo();addEnt({type:"mline",layer:drawLayer(),pts:D.pts,closed:!!D.closed&&D.pts.length>2,width:+o.width||20,caps:o.caps});}
    if(S.tool==="pline"&&D.pts.length>1){pushUndo();addEnt({type:"pline",layer:drawLayer(),pts:D.pts,closed:!!D.closed});}
    if(S.tool==="stair"&&D.pts.length>1){const o=S.opt.stair;pushUndo();addEnt({type:"stair",kind:"custom",layer:layerFor("MERDIVEN"),pts:D.pts,width:+o.width||100,depth:+o.depth||28,n:Math.round(pathLen(D.pts)/(+o.depth||28)),height:o.height,x:D.pts[0][0],y:D.pts[0][1],ang:0,m:1});}}

function toolDown(raw,e){const p=S.cur;

async function importFile(f,unit){const ext=f.name.split(".").pop().toLowerCase();
  if(ext==="dxf"){const txt=await f.text();const sc={mm:0.1,cm:1,m:100}[unit];const n=parseDXF(txt,sc);toast(n+" eleman içe aktarıldı");fitView();return;}
  if(ext==="png"||ext==="jpg"||ext==="jpeg"){const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});await addUnderlay(url);return;}
  if(ext==="pdf"){toast("PDF hazırlanıyor…");await loadScript("lib/pdf.worker.min.js");await loadScript("lib/pdf.min.js");
    const lib=window.pdfjsLib;const doc=await lib.getDocument({data:new Uint8Array(await f.arrayBuffer()),isEvalSupported:false}).promise;const page=await doc.getPage(1);const vp=page.getViewport({scale:2});const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;await addUnderlay(c.toDataURL("image/jpeg",0.85));return;}
  throw new Error("Bu dosya türü desteklenmiyor");}
async function shrinkImage(url,maxChars){const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});let w=im.naturalWidth,h=im.naturalHeight;let max=2400,q=.8;let out=url;
  for(let k=0;k<10;k++){const s=Math.min(1,max/Math.max(w,h));const c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);out=c.toDataURL("image/jpeg",q);if(out.length<=maxChars)break;max*=.8;q=Math.max(.5,q-.05);}
  return {src:out,ratio:h/w};}
async function addUnderlay(url){const r=await shrinkImage(url,240000);const wcm=1000,hcm=wcm*r.ratio;const c=S.view;pushUndo();const e=addEnt({type:"image",layer:"ALTLIK",op:.5,x:c.x-wcm/2,y:c.y-hcm/2,w:wcm,h:hcm,src:r.src});await saveImage(e);S.sel=new Set([e.id]);refreshPanels();draw();toast("Altlık eklendi; Ölçekle ile gerçek ölçüsüne getir");}
function parseDXF(txt,sc){const L=txt.split(/\r?\n/);const pairs=[];for(let i=0;i+1<L.length;i+=2)pairs.push([parseInt(L[i].trim(),10),L[i+1].trim()]);
  let i=0;while(i<pairs.length&&!(pairs[i][0]===2&&pairs[i][1]==="ENTITIES"))i++;const made=[];pushUndo();
  const ensureLayer=n=>{n=(n||"0").toUpperCase();if(!S.proj.layers.some(l=>l.name===n))S.proj.layers.push({name:n,color:8,on:true,lock:false});return n;};
  let poly=null;
  for(;i<pairs.length;i++){const [c,v]=pairs[i];if(c!==0)continue;if(v==="ENDSEC")break;const ent={type:v,g:{}};let j=i+1;const xs=[],ys=[];
    for(;j<pairs.length&&pairs[j][0]!==0;j++){const [cc,vv]=pairs[j];if(cc===10)xs.push(+vv);if(cc===20)ys.push(+vv);if(!(cc in ent.g))ent.g[cc]=vv;}
    const lay=ensureLayer(ent.g[8]);const G=k=>+ent.g[k];
    if(v==="LINE")made.push({type:"line",layer:lay,x1:G(10)*sc,y1:-G(20)*sc,x2:G(11)*sc,y2:-G(21)*sc});
    else if(v==="CIRCLE")made.push({type:"circle",layer:lay,cx:G(10)*sc,cy:-G(20)*sc,r:G(40)*sc});
    else if(v==="ARC"){const a0=rad(G(50)),a1=rad(G(51));let e1=a1;if(e1<a0)e1+=2*Math.PI;made.push({type:"pline",layer:lay,pts:arcPts([G(10)*sc,-G(20)*sc],G(40)*sc,-a0,-e1),closed:false});}
    else if(v==="LWPOLYLINE"){const pts=xs.map((x,k)=>[x*sc,-ys[k]*sc]);if(pts.length>1)made.push({type:"pline",layer:lay,pts,closed:(+ent.g[70]&1)===1});}
    else if(v==="POLYLINE"){poly={layer:lay,closed:(+ent.g[70]&1)===1,pts:[]};}
    else if(v==="VERTEX"&&poly){poly.pts.push([G(10)*sc,-G(20)*sc]);}
    else if(v==="SEQEND"&&poly){if(poly.pts.length>1)made.push({type:"pline",layer:poly.layer,pts:poly.pts,closed:poly.closed});poly=null;}
    i=j-1;}
  made.forEach(e=>addEnt(e));refreshPanels();draw();return made.length;}
function fitView(){const b=extents(ents());let w=b[2]-b[0]+200,h=b[3]-b[1]+200;if(Math.abs(Math.sin(S.view.r||0))>.5){const t=w;w=h;h=t;}S.view.x=(b[0]+b[2])/2;S.view.y=(b[1]+b[3])/2;S.view.z=clamp(Math.min(W()/w,H()/h)*0.85,0.02,8);updStatus();draw();}

async function open3D(){const root=document.createElement("div");root.id="v3d";root.innerHTML='<canvas></canvas><div class="float topbar"><button class="ib" type="button" id="v3close" aria-label="3D görünümü kapat">'+ico("close")+'</button><span style="font-weight:600;padding:0 8px">3D görünüm</span></div><div class="float status" style="display:flex">Sürükle: döndür · İki parmak / tekerlek: yakınlaştır · Yüksekliği girilmeyen duvarlar 280 cm, kapılar 210 cm gösterilir</div>';document.body.appendChild(root);

  const wallMat=new THREE.MeshLambertMaterial({color:isDark?0xC9D2E3:0xE9ECF2});const doorMat=new THREE.MeshLambertMaterial({color:0xE8343C,transparent:true,opacity:.75});const colMat=new THREE.MeshLambertMaterial({color:isDark?0xA9B4C8:0xB9C0CC});const stairMat=new THREE.MeshLambertMaterial({color:isDark?0x7FA8D8:0x8FB3DE});
  const lineMat=new THREE.LineBasicMaterial({color:new THREE.Color(aci(7))});
  const box=(cx,cz,len,thick,y0,h,ang,mat)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(len,h,thick),mat);m.position.set(cx,y0+h/2,cz);m.rotation.y=-ang;scene.add(m);};
  for(const e of ents()){if(!visible(e))continue;
    if(e.type==="wall"){const Hh=+e.height||280,u=wallDir(e),ang=Math.atan2(u[1],u[0]);for(const s of wallSegs(e)){const mid=(s[0]+s[1])/2;box(e.x1+u[0]*mid,e.y1+u[1]*mid,s[1]-s[0],e.thick,0,Hh,ang,wallMat);}
      for(const d of ents().filter(d=>d.type==="door"&&d.wallId===e.id&&visible(d))){const dh=+d.height||210;const t=(d.x-e.x1)*u[0]+(d.y-e.y1)*u[1];if(Hh>dh)box(e.x1+u[0]*t,e.y1+u[1]*t,d.width,e.thick,dh,Hh-dh,ang,wallMat);box(d.x,d.y,d.width,4,0,dh,ang,doorMat);}}
    else if(e.type==="column"){const Hc=+e.height||280;if(e.shape==="round"){const m=new THREE.Mesh(new THREE.CylinderGeometry(e.w/2,e.w/2,Hc,24),colMat);m.position.set(e.x,Hc/2,e.y);scene.add(m);}else box(e.x,e.y,e.w,e.d,0,Hc,-rad(e.ang||0),colMat);}
    else if(e.type==="stair"&&e.kind==="sketch"){const Ht=+e.height||e.n*17.5,rz=Ht/e.n;let k=0;
      for(const fl of e.flights){if(fl.steps){for(const q of fl.steps){const sh=new THREE.Shape(q.map(p=>new THREE.Vector2(p[0],-p[1])));const m=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:rz*(k+1),bevelEnabled:false}),stairMat);m.rotation.x=-Math.PI/2;scene.add(m);k++;}continue;}
        const tr=fl.treads;if(!tr.length)continue;const u=[tr[0][1][0]-tr[0][0][0],tr[0][1][1]-tr[0][0][1]];const len=Math.hypot(u[0],u[1]);const ang=Math.atan2(u[1],u[0]);const sp=fl.spacing;

function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement;}
function updFull(){const b=$("#btnFull");const on=!!fsEl();b.innerHTML=ico(on?"unfull":"full");b.setAttribute("aria-label",on?"Tam ekrandan çık":"Tam ekran");setTimeout(draw,60);}
$("#btnFull").onclick=async()=>{try{if(fsEl()){await (document.exitFullscreen||document.webkitExitFullscreen).call(document);}else{const el=document.documentElement;const req=el.requestFullscreen||el.webkitRequestFullscreen;if(!req)throw 0;await req.call(el,{navigationUI:"hide"});}}catch(e){fullHelp();}};
document.addEventListener("fullscreenchange",updFull);document.addEventListener("webkitfullscreenchange",updFull);
function fullHelp(){modal('<h2>Tam ekran bu görünümde açılmıyor</h2><p>Claude uygulamasının içindeki pencere tam ekrana izin vermiyor. Tabletinde bağlantıyı Chrome ya da Huawei Tarayıcı ile açıp bu butona yeniden bas; tarayıcıda tam ekran çalışır.</p><p>Tarayıcı menüsünden “Ana ekrana ekle” dersen FourmisDraw uygulama simgesiyle açılır.</p><div class="mfoot"><button class="btn primary" type="button" id="fOk">Tamam</button></div>',close=>{$("#fOk").onclick=close;});}
function scrAngle(){const a=(screen.orientation&&typeof screen.orientation.angle==="number")?screen.orientation.angle:(typeof window.orientation==="number"?window.orientation:0);return ((a%360)+360)%360;}
let lastAng=scrAngle();
function updUnrot(){const r=S.view.r||0;$("#btnUnrot").hidden=!(S.proj&&Math.abs(Math.sin(r/2))>1e-3);}
function onOrient(){const a=scrAngle();let d=a-lastAng;lastAng=a;if(!d||!S.proj||!SET.lockRot)return;S.view.r=((S.view.r||0)-rad(d))%(2*Math.PI);updUnrot();setTimeout(draw,50);setTimeout(draw,350);}
if(screen.orientation&&screen.orientation.addEventListener)screen.orientation.addEventListener("change",onOrient);else window.addEventListener("orientationchange",onOrient);
$("#btnUnrot").onclick=()=>{S.view.r=0;updUnrot();draw();};
/* ================= boot ================= */
applyTheme();renderHome();
(async()=>{try{const db=window.claude&&window.claude.use?await window.claude.use("db"):null;if(db){DB=db;storeKind="db";
  // carry over projects saved locally before the store was reachable
  const local=lsAll();for(const p of local){try{await DB.doc("projects/"+p.id).set(p);}catch(e){}}if(local.length){try{localStorage.removeItem(LS_KEY);}catch(e){}}
  if(homeVisible())renderHome();}}catch(e){}})();
})();
</script>
